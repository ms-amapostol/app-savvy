<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>App Savvy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2048%2048%27%3E%3Crect%20x%3D%272%27%20y%3D%272%27%20width%3D%2744%27%20height%3D%2744%27%20rx%3D%2711%27%20fill%3D%27%23ffffff%27/%3E%3Cpath%20d%3D%27M24%208a12%2012%200%200%201%207%2021.7c-1.4%201-2%202.2-2.2%203.5h-9.6c-.2-1.3-.8-2.5-2.2-3.5A12%2012%200%200%201%2024%208z%27%20fill%3D%27%232f8a72%27/%3E%3Crect%20x%3D%2719%27%20y%3D%2735%27%20width%3D%2710%27%20height%3D%273.4%27%20rx%3D%271.5%27%20fill%3D%27%232f8a72%27/%3E%3Cpath%20d%3D%27M35%2011l1.3%203%203%20.4-2.2%202.1.6%203-2.7-1.4-2.7%201.4.6-3-2.2-2.1%203-.4z%27%20fill%3D%27%23c2913a%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#eef3f1; --surface:#ffffff; --mint:#e9f4ef; --mint2:#f4faf7;
    --line:#dce8e2; --mintline:#c4ddd1;
    --teal:#2f8a72; --teal-deep:#226a58; --teal-ink:#1c5548;
    --ink:#22302c; --muted:#5f6f68; --faint:#8a978f;
    --gold:#c2913a; --gold-bg:#f6efe0;
    --bad:#b0503b; --bad-bg:#f7ece8;
    --radius:12px;
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:16px 22px 70px}
  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;color:var(--ink)}
  em{font-style:italic}
  .caps{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--teal);font-weight:600}
  .muted{color:var(--muted)} .small{font-size:13px}
  .sub{color:var(--muted);font-size:15px;margin:0 0 18px}
  .lede{font-size:16.5px;color:var(--muted);line-height:1.7}
  p{margin:0 0 14px}
  a{color:var(--teal-deep)}

  .topbanner{width:100%;height:auto;border-radius:16px;display:block;margin-bottom:14px;border:1.5px solid var(--mintline)}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .mark{width:44px;height:44px;border-radius:50%;background:#ffffff;border:1.5px solid var(--mintline);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand h1{font-size:23px;line-height:1.05;margin:0}
  .tagline{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:3px}
  .levelchip{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--mintline);border-radius:30px;padding:5px 14px 5px 6px;cursor:pointer;font-family:inherit}
  .levelchip:hover{border-color:var(--teal)}
  .ringwrap{position:relative;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .ringwrap .lvlemoji{position:absolute;font-size:13px}
  .lvltext{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .lvltext b{font-size:13.5px;color:var(--ink)} .lvltext span{font-size:11px;color:var(--muted)}

  .tabs{display:flex;gap:5px;background:var(--surface);border:1.5px solid var(--line);border-radius:30px;padding:5px;margin-bottom:12px;overflow-x:auto}
  .tabs button{flex:1;white-space:nowrap;background:none;border:none;border-radius:24px;color:var(--muted);padding:8px 12px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{background:var(--teal);color:#fff;font-weight:600}
  .meta{font-size:13.5px;color:var(--muted);margin:0 4px 16px;font-style:italic}
  .quotebar{display:flex;align-items:center;gap:11px;background:var(--mint2);border:1.5px solid var(--mintline);border-radius:14px;padding:10px 15px;margin-bottom:12px}
  .quotebar .qmark{font-family:var(--serif);font-size:22px;color:var(--teal);line-height:1;flex-shrink:0}
  .quotebar .qtext{flex:1;font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--teal-ink);transition:opacity .4s;line-height:1.4}
  .quotebar .qref{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;padding:4px;flex-shrink:0}
  .quotebar .qref:hover{color:var(--teal)}

  .card{background:var(--surface);border:1.5px solid var(--mintline);border-radius:16px;padding:22px 26px;margin-bottom:16px}
  .card h2{font-size:24px;margin:0 0 10px}
  .card h3.hd{font-size:16px;margin:22px 4px 10px}
  .pilltag{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--mintline);border-radius:30px;padding:4px 13px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--teal-deep);font-weight:600;margin-bottom:14px}

  .btn{background:var(--teal);border:1.5px solid var(--teal);color:#fff;padding:11px 20px;border-radius:30px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:var(--teal-deep);border-color:var(--teal-deep)}
  .btn.ghost{background:var(--surface);color:var(--teal-deep);border-color:var(--mintline)}
  .btn.ghost:hover{background:var(--mint2)}
  .btn.mini{padding:8px 15px;font-size:13px}
  .btn.big{padding:13px 26px;font-size:15.5px}
  .prow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .levelcard{display:flex;align-items:center;gap:22px}
  .lc-ring{position:relative;width:92px;height:92px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .lc-ring .lc-emoji{position:absolute;font-size:34px}
  .lc-body{flex:1}
  .lc-body h2{margin:2px 0 10px}
  .xpbar{height:9px;background:var(--mint2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
  .xpbar>i{display:block;height:100%;background:var(--teal)}

  .snap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
  @media(max-width:520px){.snap{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat .se{font-size:18px} .stat b{display:block;font-size:20px;font-family:var(--serif);color:var(--teal-deep);margin:2px 0} .stat .sl{font-size:12px;color:var(--muted)}
  .persona{font-size:13.5px;color:var(--muted);background:var(--mint2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px}
  .caprow{padding:12px 0;border-bottom:1px solid var(--line)}
  .caprow:last-of-type{border-bottom:none}
  .caphead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;font-weight:500}
  .captag{font-size:11px;padding:2px 10px;border-radius:30px;white-space:nowrap;font-weight:600}
  .tag-have{background:var(--mint);color:var(--teal-deep);border:1px solid var(--mintline)}
  .tag-build{background:var(--gold-bg);color:var(--gold);border:1px solid #e6d6ad}
  .tag-edge{background:#f7ece8;color:var(--bad);border:1px solid #e6c7bf}
  .capbar{display:flex;gap:5px;margin:7px 0 5px}
  .capbar span{height:7px;flex:1;border-radius:4px;background:var(--mint2);border:1px solid var(--line)}
  .capbar span.on{background:var(--teal);border-color:var(--teal)}
  .capd{font-size:13px;color:var(--muted)}
  .airead{font-size:15px;line-height:1.6;background:var(--mint2);border:1px solid var(--mintline);border-radius:12px;padding:12px 15px}
  .tabs.locked{opacity:.45;pointer-events:none}
  .grown{color:var(--teal-deep);font-weight:600;font-size:12px}
  .capnudge{color:var(--gold);font-weight:500;font-size:12px}

  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:26px}
  .badge2{border:1.5px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;background:var(--mint2);opacity:.55}
  .badge2.on{opacity:1;border-color:var(--gold);background:var(--gold-bg)}
  .badge2 span{font-size:24px;display:block} .badge2 b{font-size:12.5px;display:block;margin-top:4px;font-weight:600}

  .testcard{background:var(--mint2)}
  .up{color:var(--teal-deep);font-weight:600}

  .how{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(max-width:520px){.how{grid-template-columns:1fr}}
  .howc{border:1.5px solid var(--line);border-radius:14px;padding:15px 17px;background:var(--mint2)}
  .howc .he{font-size:22px} .howc b{display:block;font-family:var(--serif);font-size:17px;margin:6px 0 4px} .howc span{font-size:13.5px;color:var(--muted)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .pair>.card{margin-bottom:0}
  @media(max-width:640px){.pair{grid-template-columns:1fr}}
  .howrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
  .howrow:last-child{border-bottom:none}
  .howrow .he{font-size:18px;flex-shrink:0;line-height:1.3}
  .howrow b{display:block;font-size:14.5px}
  .howrow span{font-size:13px;color:var(--muted)}
  .cta{margin-top:22px}

  .reccard{display:flex;align-items:center;gap:16px;background:var(--mint2);border:1.5px solid var(--mintline);border-radius:14px;padding:16px 18px;flex-wrap:wrap}
  .reccard>div{flex:1;min-width:180px}

  details.curric{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:4px 8px;margin-bottom:16px}
  details.curric summary{cursor:pointer;list-style:none;padding:14px 14px;display:flex;align-items:center;gap:8px}
  details.curric summary::-webkit-details-marker{display:none}
  .ulist{padding:0 6px 10px}
  .urow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink)}
  .urow:hover{background:var(--mint2);border-color:var(--line)}
  .urow.on{background:var(--mint);border-color:var(--mintline)}
  .unum{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--mintline);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;background:var(--mint2)}
  .ulbl{flex:1} .udone{font-size:12px;color:var(--teal)}

  .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  @media(max-width:560px){.vgrid{grid-template-columns:1fr}}
  .vcard{background:var(--mint2);border:1px solid var(--line);border-radius:14px;padding:13px 16px}
  .vcard b{font-weight:600}.vcard .d{font-size:13.5px;color:var(--muted);margin-top:3px}
  .unlock{background:var(--gold-bg);border:1px solid #e6d6ad;border-radius:14px;padding:14px 18px;margin-top:18px;font-size:14.5px}
  .unlock .caps{color:var(--gold)}
  .actions{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

  .dots,.qdots{display:flex;gap:6px;margin-bottom:16px}
  .dots span,.qdots span{height:5px;flex:1;border-radius:3px;background:var(--line)}
  .dots span.on,.qdots span.on{background:var(--teal)} .qdots span.done{background:var(--mintline)}
  .prompt{font-size:18px;line-height:1.6;font-family:var(--serif)}
  .doors{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
  @media(max-width:560px){.doors{grid-template-columns:1fr}}
  .door{text-align:left;padding:18px 20px;border:1.5px solid var(--mintline);border-radius:16px;background:var(--mint2);cursor:pointer;font-family:inherit}
  .door:hover{border-color:var(--teal);background:var(--mint)}
  .door .k{font-family:var(--serif);font-weight:600;font-size:17px}.door .s{font-size:13.5px;color:var(--muted);margin-top:3px}
  textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:14px;background:var(--mint2);color:var(--ink);padding:13px 15px;font-family:inherit;font-size:15px;line-height:1.55;resize:vertical}
  textarea:focus{outline:none;border-color:var(--teal)}
  input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--mint2);color:var(--ink);padding:12px 15px;font-family:inherit;font-size:14.5px}
  input:focus{outline:none;border-color:var(--teal)}
  .pilllabel{display:inline-block;font-size:12px;padding:3px 11px;border-radius:30px;background:var(--mint2);border:1px solid var(--line);color:var(--muted)}
  .rev{border-left:3px solid var(--mintline);padding:2px 0 2px 15px;margin-bottom:16px}
  .rev.hl{border-color:var(--teal)}
  .rev .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;font-weight:600}
  .rev .val{font-size:15.5px;line-height:1.55}
  .badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:30px;font-weight:600}
  .badge.draft{background:var(--gold-bg);color:var(--gold);margin-left:6px}
  .badge.agree{background:var(--mint);color:var(--teal-deep);border:1px solid var(--mintline)}
  .badge.differ{background:var(--gold-bg);color:var(--gold);border:1px solid #e6d6ad}
  .probe{display:flex;gap:13px}
  .probe .av{width:34px;height:34px;border-radius:50%;background:var(--mint);border:1.5px solid var(--mintline);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
  .thinking{color:var(--muted);font-style:italic}
  .zoom{background:var(--mint2);border:1.5px solid var(--mintline);border-radius:16px;padding:20px 24px;margin-top:20px}
  .zoom h3{margin:0 0 10px;font-size:18px}
  .zoom .rec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-size:14px;margin-top:14px;color:var(--teal-deep)}
  .score{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  .score .n{font-family:var(--serif);font-weight:600;color:var(--teal-deep);font-size:20px}

  .opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .opt{text-align:left;border:1.5px solid var(--mintline);border-radius:12px;background:var(--mint2);padding:12px 15px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink)}
  .opt:hover{border-color:var(--teal);background:var(--mint)}
  .opt.sel{border-color:var(--teal);background:var(--mint);font-weight:500}
  .code{background:#f4faf7;border:1px solid var(--line);border-radius:12px;padding:12px 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6;overflow-x:auto}
  .cl{display:flex;gap:12px;padding:1px 12px;white-space:pre}
  .cl .ln{color:var(--faint);user-select:none;min-width:16px;text-align:right}
  .cl.bug{background:var(--bad-bg);border-radius:4px}
  .val code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--mint2);padding:2px 6px;border-radius:5px}

  .glossitem{border-bottom:1px solid var(--line);padding:14px 0}
  .glossitem:last-child{border:none}
  .glossitem .t{font-family:var(--serif);font-weight:600;font-size:17px}
  .glossitem .d{color:var(--muted);font-size:14.5px;margin:3px 0}
  .glossitem .from{font-size:12.5px;color:var(--faint)}
  .gtag{font-size:11px;color:var(--teal-deep);background:var(--mint);border:1px solid var(--mintline);border-radius:30px;padding:1px 9px;margin-left:6px}
  .cmap-row{margin-bottom:16px}
  .cmap-row .rowtop{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px}
  .cmap-row .rowtop .n{color:var(--muted)}
  .bar{height:9px;background:var(--mint2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--mintline)}.bar>i.hot{background:var(--teal)}
  .empty{color:var(--muted);text-align:center;padding:34px 16px;font-size:15px}
  .fw{display:flex;flex-direction:column;gap:14px}
  .fwitem{font-size:14.5px;line-height:1.6;padding-left:14px;border-left:3px solid var(--mintline)}
  .fwitem b{font-weight:600}
  .fwitem a{white-space:nowrap;font-weight:500}
  .keyrow{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}

  .celebrate{position:fixed;inset:0;z-index:50;pointer-events:auto;overflow:hidden}
  .confetti{position:absolute;top:-24px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(680deg);opacity:.2}}
  .toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);background:var(--surface);border:1.5px solid var(--mintline);border-radius:16px;padding:16px 20px;box-shadow:0 12px 40px rgba(20,60,50,.18);min-width:230px}
  .tline{display:flex;align-items:center;gap:12px;padding:4px 0}
  .tline .te{font-size:26px}.tline b{display:block;font-family:var(--serif);font-size:17px}.tline span{font-size:13px;color:var(--muted)}
  .askfab{position:fixed;right:22px;bottom:22px;z-index:60;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(20,60,50,.28);font-size:22px;line-height:1;display:none;align-items:center;justify-content:center}
  .askfab:hover{background:var(--teal-deep)}
  .askpanel{position:fixed;right:22px;bottom:88px;z-index:60;width:370px;max-width:calc(100vw - 44px);max-height:72vh;background:var(--surface);border:1.5px solid var(--mintline);border-radius:16px;box-shadow:0 16px 44px rgba(20,60,50,.22);display:none;flex-direction:column;overflow:hidden}
  .askpanel.open{display:flex}
  .askpanel .head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
  .askpanel .head b{font-family:var(--serif);font-size:16px;font-weight:600}
  .askpanel .body{padding:14px 16px;overflow-y:auto}
  .askclose{background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px}
  .askclose:hover{color:var(--ink)}
  .scaffold{background:var(--mint2);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin:14px 0}
  .scaffold .caps{display:block;margin-bottom:6px}
  .scaffold ul{margin:0;padding-left:18px}
  .scaffold li{font-size:13.5px;color:var(--muted);margin:3px 0;line-height:1.5}
  .lessonchip{display:inline-block;background:var(--mint);border:1px solid var(--mintline);border-radius:30px;padding:4px 12px;font-size:12.5px;color:var(--teal-deep);margin-top:8px}
  .askhint{background:var(--mint2);border:1px dashed var(--mintline);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:13px;color:var(--muted);line-height:1.55}
  .askhint b{color:var(--teal-deep)}
  .actcard{position:relative}
  .exitbtn{position:absolute;top:12px;right:14px;background:none;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:12px;padding:3px 11px;cursor:pointer;z-index:2}
  .exitbtn:hover{color:var(--bad);border-color:#e6c7bf}
  .objbox{background:var(--gold-bg);border:1px solid #e6d6ad;border-radius:12px;padding:12px 16px;margin:12px 0 6px}
  .objbox .caps{display:block;color:var(--gold);margin-bottom:4px}
  .objbox>div{font-size:15.5px;line-height:1.5}
  .lessonhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}
  .diagram{background:var(--mint2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px;text-align:center}
  .diagram svg{max-width:100%;height:auto}

  { id:"u1", emoji:"🧱", title:"How an app is put together",
    objective:"Describe where an app's pieces live and which piece does what — so “the frontend can't reach the backend” already means something to you.",
    lesson:`<p>Almost every app is two halves talking to each other. The <b>frontend</b> is what runs in front of the user — the screen, the buttons, the typing — living on their device, in their browser or phone. The <b>backend</b> is the part that runs somewhere else, on a server you control, doing the work the user shouldn't see or can't be trusted with: holding the real data, checking permissions, keeping secrets.</p>
    <p>Some apps have only a frontend. Your single-file apps are all frontend, which is exactly why they're so portable. The moment an app needs to remember something across users, keep a secret, or enforce a rule, it usually grows a backend. Knowing which half you're standing in tells you what's possible and what isn't.</p>`,
    vocab:[{t:"Frontend",d:"What runs on the user's device — screen, buttons, input."},{t:"Backend",d:"What runs on a server you control — data, rules, secrets."},{t:"Client / server",d:"The device that asks (client) and the machine that answers (server)."},{t:"Static vs. dynamic",d:"Fixed files vs. an app that computes responses per request."}],
    unlock:"When a client asks “can it do X,” you answer “yes, on the frontend” or “that needs a backend, here's why” — instantly, without deferring." },
  { id:"u2", emoji:"🗄️", title:"Where the data lives",
    objective:"Reason about where information is stored, who can reach it, and what happens when the same information exists in two places at once.",
    lesson:`<p>Data has to physically sit somewhere, and every choice about <em>where</em> is a choice about speed, privacy, and trust. On the user's device (your localStorage) it's private and instant but trapped there. On a server it can follow the user across devices — but now you're responsible for protecting it.</p>
    <p>The hardest problem in this unit appears the moment data lives in more than one place at once: which copy is the truth? When a user edits on their phone offline and their laptop offline, you have two truths, and something has to reconcile them. That reconciliation — how you merge, or which edit wins — is one of the most consequential and most overlooked decisions in any app that syncs.</p>`,
    vocab:[{t:"Data locality",d:"Where data physically lives — and who can reach it from there."},{t:"localStorage",d:"A small store inside one browser on one device."},{t:"Sync",d:"Keeping copies of data in step across devices."},{t:"Conflict resolution",d:"How you reconcile two edits made to the same thing in two places."},{t:"Source of truth",d:"The copy everything else is expected to agree with."},{t:"Eventual consistency",d:"Copies may disagree briefly, as long as they converge."}],
    unlock:"Data questions are where under-specified projects go to die. Being the one who asks “where does this live, and what happens when two people edit it at once” is a genuine superpower in solutions work." },
  { id:"u3", emoji:"🔌", title:"How systems talk to each other",
    objective:"Explain what an API is, what a request costs, and why the key that authorizes it is dangerous — well enough to design an integration on a whiteboard.",
    lesson:`<p>An <b>API</b> is a doorway one system opens so another can ask it for things in a predictable way. When this app calls the AI model, it sends a <b>request</b> over the network and waits for a <b>response</b>; that round-trip takes time (<b>latency</b>) and can fail — which is why a good app has a fallback.</p>
    <p>Every serious API asks <em>who are you</em>, answered with an <b>API key</b> — essentially a password that spends money or unlocks data. Integrations, the heart of forward-deployed work, are almost always this: teaching two systems that were never designed to talk to each other to exchange the right requests, safely, without falling over when one side is slow or down.</p>`,
    vocab:[{t:"API",d:"A predictable doorway one system opens for another."},{t:"Request / response",d:"The ask sent over the network, and the answer that comes back."},{t:"Authentication",d:"Proving who you are before a system will answer you."},{t:"API key / token",d:"A secret that authorizes requests — often spends money."},{t:"Latency",d:"How long the round-trip takes."},{t:"Rate limit",d:"A cap on how many requests you may send in a window."}],
    unlock:"“Make our tool talk to their system” is the sentence that starts most solutions projects. This is the unit that turns it from intimidating to routine." },
  { id:"u4", emoji:"🤖", title:"AI as an engineering component",
    objective:"Treat an AI model as an engineering part with known behaviors and failure modes — so you can design around it, bound it, and check its work.",
    lesson:`<p>A generative model is a component you don't fully control, and the professional skill is <em>bounding</em> it well. The <b>system prompt</b> is your main lever — standing instructions that shape behavior. The model has no memory beyond what you hand it each time (its <b>context</b>), which is why <b>RAG</b> exists: you retrieve the relevant facts and feed them in, so the model answers from real data instead of guessing.</p>
    <p>Because the same input can give different outputs (<b>non-determinism</b>), you can't just eyeball it once — you need <b>evaluation</b>, a repeatable way to check it's still doing the right thing. In 2026 this is the fastest-rising part of the FDE skill set: orchestrating AI, guarding it, and proving it works.</p>`,
    vocab:[{t:"System prompt",d:"Standing instructions that shape how a model behaves."},{t:"Context window",d:"Everything the model can “see” for one response."},{t:"RAG",d:"Retrieval-augmented generation — feeding in real facts to answer from."},{t:"Non-determinism",d:"Same input, possibly different output each time."},{t:"Evaluation (evals)",d:"A repeatable check that the AI still does the right thing."},{t:"Guardrails",d:"Constraints that keep a flexible system inside bounds."}],
    unlock:"This is the newest, least-crowded vertical of the T. Most people with your client skills can't speak it; most who can speak it lack your client skills. The overlap is where the market is paying." },
  { id:"u5", emoji:"🔒", title:"Trust, secrets, and what breaks",
    objective:"Spot the security and privacy tradeoff in a design before it becomes an incident — and speak to it plainly with a nervous client.",
    lesson:`<p>Security is mostly two questions: what secrets does this system hold, and what happens if the wrong person reaches them. A <b>secret</b> is anything that unlocks money or data — an API key, a password, a token. The cardinal rule you already live by: a secret in the frontend is readable by anyone who opens their browser's developer tools, which is why this app keeps your key in localStorage and never in the shared file.</p>
    <p><b>Privacy</b> is the sibling question — whose data is this, where does it live, who can see it. Clients hand FDEs access to sensitive systems, so being visibly careful here is how you earn the trust that lets you do the job at all.</p>`,
    vocab:[{t:"Secret",d:"Anything that unlocks money or data if leaked."},{t:"Client-side exposure",d:"Frontend code is readable by anyone who looks."},{t:"Encryption",d:"Scrambling data so only the right key can read it."},{t:"Least privilege",d:"Giving each part only the access it truly needs."},{t:"Attack surface",d:"Every place a system could be poked at or broken in."}],
    unlock:"“Is this safe?” is the question that stalls enterprise deals. An FDE who answers it honestly and specifically, without hand-waving, is worth their whole salary in that moment." },
  { id:"u6", emoji:"📦", title:"Shipping, and the bill that comes later",
    objective:"Weigh a decision by its cost over time, and name the debt a shortcut is quietly taking on.",
    lesson:`<p>Everything you build has two prices: what it costs to make, and what it costs to keep. <b>Maintainability</b> is the second price, and it's the one beginners forget. A feature that's appealing today but taxes every future change (your rejected two-column layout) can be a net loss even if it works perfectly.</p>
    <p><b>Technical debt</b> is the name for shortcuts that borrow speed now against pain later — sometimes a smart loan, sometimes a trap. The judgment is knowing which. Your instinct to keep things single-file and simple <em>is</em> this unit: you've been paying down maintenance cost by refusing to take it on.</p>`,
    vocab:[{t:"Maintainability",d:"How cheaply a thing can be kept working and changed."},{t:"Cost of ownership",d:"The total ongoing cost of keeping a feature alive."},{t:"Technical debt",d:"Speed borrowed now, repaid later with interest."},{t:"Scalability",d:"Whether it still works as data or users grow."},{t:"Coupling",d:"How tangled two parts are — tangled means hard to change."},{t:"Separation of concerns",d:"Keeping distinct kinds of work in distinct places."}],
    unlock:"FDEs build fast under deadline pressure — exactly when debt accrues. The one who can say “we can ship this shortcut, here's the interest we'll pay in Q3” is the one clients keep." },
  { id:"u7", emoji:"🔍", title:"Reading the machine when it breaks",
    objective:"Approach a broken system methodically — form a hypothesis, find where reality diverges from expectation, narrow it down — instead of guessing.",
    lesson:`<p>Debugging is an investigation skill — the same one you'd use to find why a process is losing time on a factory floor. The method: reproduce the problem reliably, decide what you <em>expected</em> to happen, find the first place the machine disagreed with you, and narrow the search in half until you've cornered it.</p>
    <p>The tools are just windows into the machine's actual behavior — <b>logs</b> (what it recorded doing), <b>errors</b> (where it gave up), the browser <b>console</b> (what the frontend is complaining about). You don't need to write the fix to locate the fault, and locating the fault is 80% of the work.</p>`,
    vocab:[{t:"Reproduce",d:"Make the bug happen on demand — step one, always."},{t:"Logs",d:"The running record of what a system actually did."},{t:"Error / stack trace",d:"Where it gave up, and the trail that led there."},{t:"Console",d:"The browser's window into frontend complaints."},{t:"Root cause",d:"The real fault underneath the visible symptom."}],
    unlock:"When a client's deployment is on fire, the person who calmly narrows the problem is the one who matters most in that moment. The method is already yours from operations.",
    sabotage:true },
  { id:"u8", emoji:"⚖️", title:"Judgment: naming the tradeoff",
    objective:"Look at any design decision and articulate the real tradeoff underneath it in plain language — the meta-skill the whole deck trains.",
    lesson:`<p>Almost every architectural decision comes down to a defensible answer you can justify. Strong technical judgment is naming what you're trading and choosing on purpose. Every other unit is a specific instance of this one: local vs. synced trades privacy against continuity, simple vs. built trades speed against scale, guardrails vs. freedom trades safety against range.</p>
    <p>When you can hear a decision and immediately say “the real question here is X against Y,” you've become someone who can lead the conversation. This is also where taste lives — knowing when a change hasn't earned its place and undoing it, which your four reverts taught you better than any lecture could.</p>`,
    vocab:[{t:"Tradeoff",d:"What you give up to get what you chose."},{t:"Failure mode",d:"The specific way a choice goes wrong when it does."},{t:"Defensible decision",d:"One you can justify by its tradeoff, right answer or not."},{t:"Premature optimization",d:"Solving a problem before you've confirmed it exists."},{t:"Taste as an input",d:"Judgment about feel, treated as real design data."}],

function renderQuiz(){
 const isDiag=quiz.type==="diag";const bank=isDiag?DIAG:INTAKE;
 if(quiz.i>=bank.length){finishQuiz();return;}
 const q=bank[quiz.i];const multi=!isDiag&&q.multi;const sel=quiz.answers[quiz.i];
 root.innerHTML=`<div class="card">
   <div class="qdots">${bank.map((_,i)=>`<span class="${i<quiz.i?'done':i===quiz.i?'on':''}"></span>`).join("")}</div>
   <span class="caps">${isDiag?(quiz.slot==="pre"?'Baseline · judgment check':'Growth check'):'A quick intro about you'}</span>
   <h2 style="margin:8px 0 6px">${esc(q.q)}</h2>
   <p class="muted small" style="margin:0 0 14px">${isDiag?'No wrong answers to sweat — this just measures where you are.':(multi?'Pick as many as fit — you can be several of these.':(q.cap?'Be honest — this just places you on the map, and stays private to you.':'Shapes how the app talks to you. Change it anytime.'))}</p>
   <div class="opts">${q.opts.map((o,i)=>{const on=multi&&Array.isArray(sel)&&sel.indexOf(i)>=0;return `<button class="opt${on?' sel':''}" data-q="${i}">${on?'✓ ':''}${esc(o.t)}</button>`;}).join("")}</div>
   <div class="prow" style="margin-top:14px">${multi?`<button class="btn" id="qNext">Continue →</button>`:''}${quiz.i>0?'<button class="btn ghost mini" id="qBack">← back</button>':''}${(isDiag&&quiz.onboarding)?'<button class="btn ghost mini" id="qSkip">Skip for now →</button>':''}</div>
 </div>`;
 if(multi){
   root.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{let arr=Array.isArray(quiz.answers[quiz.i])?quiz.answers[quiz.i]:[];const ix=parseInt(b.dataset.q),p=arr.indexOf(ix);if(p>=0)arr.splice(p,1);else arr.push(ix);quiz.answers[quiz.i]=arr;renderQuiz();});
   const nx=root.querySelector("#qNext");if(nx)nx.onclick=()=>{const a=quiz.answers[quiz.i];if(!Array.isArray(a)||!a.length)return;quiz.i++;render();window.scrollTo(0,0);};
 } else {
   root.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{quiz.answers[quiz.i]=parseInt(b.dataset.q);quiz.i++;render();window.scrollTo(0,0);});
 }
 const bk=root.querySelector("#qBack");if(bk)bk.onclick=()=>{quiz.i--;render();};
 const sk=root.querySelector("#qSkip");if(sk)sk.onclick=()=>{quiz=null;tab="home";syncTabs();render();window.scrollTo(0,0);};
}
function finishQuiz(){
 if(quiz.type==="intake"){
   const p={};INTAKE.forEach((q,i)=>{const a=quiz.answers[i];if(q.multi){p[q.key]=(Array.isArray(a)?a:[]).map(ix=>q.opts[ix].v);}else{p[q.key]=q.opts[a].v;}});
   state.profile=p;state.onboarded=true;state.capSnapshot=null;capMovement();save();syncTabs();if(!state.pre){quiz={type:"diag",slot:"pre",onboarding:true,i:0,answers:[]};}else{quiz=null;tab="home";}render();
   celebrate([{big:"Nice — you're set up",small:state.pre?"Welcome in":"Now let's find your baseline",e:"🎉"}]);
 } else {
   let score=0;DIAG.forEach((q,i)=>{const o=q.opts[quiz.answers[i]];if(o&&o.ok)score++;});
   const slot=quiz.slot;state[slot]={score:score,date:todayStr()};const prevXp=state.xp;addXP(15);
   quiz=null;tab="home";syncTabs();commitProgress(prevXp);render();
 }
}

async function teachFeedback(concept,model,text){const sys="You are a warm teaching coach for a business person becoming fluent in software (not an engineer). They just explained a concept to a beginner colleague. In 2-3 short sentences: praise what landed, then one concrete way to make it clearer or more accurate. Plain language, encouraging, no jargon. End with a short verdict line.";const usr="Concept: "+concept+". A strong explanation would get across: "+model+". Their explanation: "+text;const out=await callClaude(sys,usr,260);return out||((state.apiKey&&lastAIError)?("(AI feedback unavailable — "+lastAIError+") "):"")+"Nice work. The real test: would a non-technical friend get it from what you wrote? Check that you named the core idea and why it matters, in plain words — if yes, you have it.";}

function renderDoorHTML(){

 else if(sess.step===1){const c=sess.pick==="A"?d.doorA.k:d.doorB.k;inner=`<span class="caps">Step 2 · Make your case</span><p class="muted small" style="margin:8px 0 10px">You picked <b style="color:var(--ink)">Door ${sess.pick} — ${esc(c)}</b>. A sentence or two is plenty.</p>${SCAFFOLD}<textarea id="defend" placeholder="Try: I would pick this because it trades [X] for [Y]. The risk is [how it could fail], and for this situation that is worth it.">${esc(sess.defend)}</textarea><div class="actions"><button class="btn ghost mini" data-back="0">← change door</button><button class="btn" id="go2">Submit reasoning →</button></div>`;}
 else if(sess.step===2){inner=`<span class="caps">Step 3 · ✨ The tutor probes</span><div class="probe" style="margin-top:8px"><div class="av">💬</div><div class="prompt" id="probeText">${sess.probe?esc(sess.probe):'<span class="thinking">The tutor is reading your reasoning…</span>'}</div></div><textarea id="answer" placeholder="Answer once — just a single exchange." style="margin-top:16px">${esc(sess.answer)}</textarea><div class="actions"><span class="pilllabel">${AI_ON?'✨ live tutor':'offline tutor'}</span><button class="btn" id="go3">Answer &amp; reveal →</button></div>`;}
 else if(sess.step===3){const c=d.chosen,ct=c==="A"?d.doorA.k:d.doorB.k,m=sess.pick===c;inner=`<span class="caps">Step 4 · The reveal</span><div class="rev hl" style="margin-top:10px"><div class="lab">What you actually chose</div><div class="val">Door ${c} — ${esc(ct)} · <span class="muted">${esc(d.project)}, ${esc(d.when)}</span> ${m?'<span class="badge agree">you agreed</span>':'<span class="badge differ">you differed</span>'}</div></div><div class="rev"><div class="lab">What happened downstream ${d.downstreamDraft?'<span class="badge draft">DRAFT — your call</span>':''}</div><div class="val">${esc(d.downstream)}</div></div><div class="rev"><div class="lab">What the other door would have cost</div><div class="val">${esc(d.otherDoorCost)}</div></div><div class="actions"><div class="score">✨ Reasoning score: <span class="n" id="scoreN">${sess.score!=null?sess.score:'…'}</span><span class="muted small">/ 5</span></div><button class="btn" id="go4">Zoom out →</button></div>`;}
 else if(sess.step===4){const rc=countGroup(d.group);inner=`<span class="caps">Step 5 · Vocabulary &amp; principle</span><p class="muted small" style="margin:8px 0 4px">This decision was secretly about:</p><div class="vgrid">${d.terms.map(t=>`<div class="vcard"><b>${esc(t.t)}</b><div class="d">${esc(t.d)}</div></div>`).join("")}</div><div class="zoom"><h3>⤢ Zoom out — the principle</h3><div class="prompt" style="font-size:16px">${esc(d.principle)}</div><div class="rec">↻ You've hit “${esc(d.group)}” ${rc} ${rc===1?'time':'times'} now.${rc>=3?' When a shape shows up a third time, it\'s a pattern you own.':''}</div></div><div class="actions"><span class="muted small">One more — teaching it is how it sticks.</span><button class="btn" id="go5">Teach it back →</button></div>`;}

}

/* ===== SABOTAGE ===== */
function startSabotage(uid){const seen=new Set(state.history.filter(h=>h.type==="sab").map(h=>h.id.replace("sab-","")));const fresh=SABOTAGE.filter(r=>!seen.has(r.id));const pool=fresh.length?fresh:SABOTAGE;sab={r:pool[Math.floor(Math.random()*pool.length)],from:uid,step:0,choice:null,ownerTab:uid?"learn":"practice"};tab=uid?"learn":"practice";syncTabs();render();window.scrollTo(0,0);}
function renderSabotageHTML(){
 const r=sab.r;const code=r.lines.map(function(ln,i){return `<div class="cl${(sab.step===1&&i===r.fixLine)?' bug':''}"><span class="ln">${i+1}</span><span>${esc(ln)}</span></div>`;}).join("");let inner;
 if(sab.step===0){inner=`<span class="caps">🔍 Sabotage round</span><p class="muted small" style="margin:8px 0 12px">${esc(r.blurb)} <b style="color:var(--ink)">Exactly one thing here is broken — find it.</b></p><div class="code">${code}</div><p class="muted small" style="margin:16px 0 8px">What's wrong?</p><div class="opts">${r.options.map(function(o,i){return `<button class="opt" data-opt="${i}">${esc(o.t)}</button>`;}).join("")}</div>`;}
 else{const o=r.options[sab.choice],ok=o.ok,correct=r.options.filter(function(x){return x.ok;})[0];inner=`<span class="caps">🔍 The fault</span><div class="code" style="margin-top:8px">${code}</div><div class="rev ${ok?'hl':''}" style="margin-top:16px"><div class="lab">${ok?'✓ You found it':'Not quite — the real bug is on line '+(r.fixLine+1)}</div><div class="val">${esc(correct.why)}</div></div><div class="rev"><div class="lab">The fix</div><div class="val"><code>${esc(r.fix)}</code></div></div><div class="zoom"><h3>🧭 The method</h3><div class="prompt" style="font-size:15.5px">${esc(r.method)}</div><div class="rec">New term earned — <b>${esc(r.term.t)}</b>: ${esc(r.term.d)}</div></div><div class="actions"><span class="muted small">${ok?'Nice debugging.':'Now you\'ll spot it next time.'}</span><button class="btn" id="sabDone">Finish ✓</button></div>`;}
 return `<div class="card actcard"><button class="exitbtn" id="exitAct" title="Leave — you can start over later">✕ exit</button>${inner}</div>`;
}
function wireSabotage(){root.querySelectorAll("[data-opt]").forEach(function(b){b.onclick=function(){sab.choice=parseInt(b.dataset.opt);sab.step=1;render();window.scrollTo(0,0);};});const sd=root.querySelector("#sabDone");if(sd)sd.onclick=function(){finishSabotage();};var ex=root.querySelector("#exitAct");if(ex)ex.onclick=function(){exitActivity();};}
function finishSabotage(){
 state.resume=null;
 const r=sab.r,fu=sab.from,correct=!!r.options[sab.choice].ok,prevXp=state.xp;
 bumpStreak();state.faced+=1;addXP(correct?20:10);
 state.history.push({id:"sab-"+r.id,group:"Debugging by method",type:"sab",correct:correct,date:todayStr()});
 if(!state.glossary.some(g=>g.t===r.term.t))state.glossary.push({t:r.term.t,d:r.term.d,from:r.id,fromLabel:"Sabotage · debugging",group:"Debugging by method"});
 commitProgress(prevXp);sab=null;
 if(fu){tab="learn";learnUnit=fu;syncTabs();render();}else{tab="practice";syncTabs();renderPractice();}
 window.scrollTo(0,0);
}

/* ===== REFERENCE (glossary + concept map) ===== */
function renderReference(){
 let gl=state.glossary.length?[...state.glossary].sort((a,b)=>a.t.localeCompare(b.t)).map(g=>`<div class="glossitem"><div class="t">${esc(g.t)}${g.group?`<span class="gtag">${esc(g.group)}</span>`:''}</div><div class="d">${esc(g.d)}</div><div class="from">Earned in — ${esc(g.fromLabel||g.from)}</div></div>`).join(""):`<div class="empty">📖 No terms yet — they arrive as you finish doors and sabotage rounds.</div>`;
 const c={};state.history.forEach(h=>{c[h.group]=(c[h.group]||0)+1;});const gs=Object.keys(c);let mp;
 if(!gs.length)mp=`<div class="empty">🗺️ The concept map fills in as you play. When a tradeoff shows up three times, that's the pattern landing.</div>`;
 else{const max=Math.max(...gs.map(g=>c[g]));mp=gs.sort((a,b)=>c[b]-c[a]).map(g=>{const n=c[g],hot=n>=3;return `<div class="cmap-row"><div class="rowtop"><span>${esc(g)}${hot?' ⭐':''}</span><span class="n">${n} ${n===1?'time':'times'}</span></div><div class="bar"><i class="${hot?'hot':''}" style="width:${Math.round(n/max*100)}%"></i></div></div>`;}).join("");}
 root.innerHTML=`<div class="card"><span class="pilltag">📚 Glossary</span><h2>Your glossary</h2><p class="sub">${state.glossary.length} term${state.glossary.length===1?'':'s'}, each anchored to the decision that taught it.</p>${gl}</div><div class="card"><span class="pilltag">🗺️ Concept map</span><h2>Tradeoffs that keep recurring</h2><p class="sub">⭐ marks a pattern you've hit three or more times — that's the signal.</p>${mp}</div><div class="card"><span class="pilltag">🧠 The thinking</span><h2>Why App Savvy works this way</h2><p class="sub">Not invented on a whim — built on how judgment and expertise are actually formed.</p><div class="fw"><div class="fwitem"><b>Judgment you can defend.</b> Real architecture usually comes down to a defensible choice, justified by naming what you trade. That is how experienced engineers frame it. <a href="https://martinfowler.com/articles/microservice-trade-offs.html" target="_blank" rel="noopener">Fowler on trade-offs ↗</a></div><div class="fwitem"><b>Testing makes it stick.</b> Retrieving an answer under a little pressure builds durable understanding — the well-replicated “testing effect.” That is why every lesson ends at a door. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3983480/" target="_blank" rel="noopener">Retrieval-practice research ↗</a></div><div class="fwitem"><b>Deliberate practice.</b> Skill grows from focused reps on well-defined tasks with immediate feedback — exactly the shape of the door loop. <a href="https://royalsocietypublishing.org/doi/10.1098/rsos.190327" target="_blank" rel="noopener">Ericsson, revisited ↗</a></div><div class="fwitem"><b>Decisions as the unit.</b> Each door mirrors an Architecture Decision Record: a decision, its context, and its consequences — how real teams capture the reasoning behind a system. <a href="https://adr.github.io/" target="_blank" rel="noopener">Architecture Decision Records ↗</a></div><div class="fwitem"><b>Aimed at the role.</b> Forward Deployed Engineers turn messy client problems into sound systems — fluency in tradeoffs is the job itself. <a href="https://en.wikipedia.org/wiki/Forward_Deployed_Engineer" target="_blank" rel="noopener">What an FDE is ↗</a> · <a href="https://posthog.com/blog/forward-deployed-engineer" target="_blank" rel="noopener">Why they are in demand ↗</a></div></div></div>`;
}

/* ===== AI & DATA ===== */
function renderKey(){
 root.innerHTML=`<div class="card"><span class="pilltag">🔑 AI &amp; data</span><h2>Turn on the AI tutor</h2><p class="sub">Add your own Anthropic API key to unlock the ✨ features — the tutor's probe, the reasoning score, and Ask anything. 🔒 Your key is saved only in this browser. It is never part of the app's code, so nobody who opens the app or views its source can see it.</p><div class="keyrow"><input type="password" id="keyIn" placeholder="sk-ant-…" value="${esc(state.apiKey||'')}" autocomplete="off" style="flex:1;min-width:220px"><button class="btn" id="saveKey">Save</button><button class="btn ghost" id="testKey">Test</button></div><p class="small muted" id="keyMsg" style="margin-top:8px">${state.apiKey?'✓ Key saved — the live tutor is on.':'No key yet — the built-in tutor is on.'}</p><p class="small muted">Get one at <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a> → API Keys, and add a few dollars of credit. Each ✨ action costs a fraction of a cent.</p><p class="small muted">✨ marks anything AI-powered. Without a key, those spots fall back to a built-in version, so nothing is ever blocked.</p><h2 style="font-size:22px;margin-top:30px">Your progress</h2><p class="sub">Everything lives in this browser. Export a backup before you clear your browser data, or to move your progress to another device.</p><div class="keyrow"><button class="btn ghost" id="dlBk">⬇ Download backup</button><button class="btn ghost" id="upBtn">⬆ Restore backup</button><input type="file" id="upFile" accept="application/json,.json" style="display:none"><button class="btn ghost" id="wipe" style="color:var(--bad);border-color:#e6c7bf">🗑 Reset all</button></div><p class="small muted" style="margin-top:12px">${state.faced} decisions · ${state.glossary.length} terms · ${state.xp} XP · streak ${state.streak}</p></div>`;
 document.getElementById("saveKey").onclick=function(){state.apiKey=document.getElementById("keyIn").value.trim();AI_ON=!!state.apiKey;save();var m=document.getElementById("keyMsg");if(m)m.textContent=state.apiKey?'✓ Key saved — the live tutor is on.':'No key yet — the built-in tutor is on.';};document.getElementById("testKey").onclick=async function(){var m=document.getElementById("keyMsg");if(!state.apiKey){if(m)m.textContent="Add a key first, then press Test.";return;}if(m)m.textContent="Testing your key…";var out=await callClaude("Reply with the single word OK.","OK",10);if(m)m.textContent=out?"✓ Working — your key and credits are good.":("✕ "+(lastAIError||"The call failed.")+(/credit|balance/i.test(lastAIError)?" → Add credits at console.anthropic.com under Plans & Billing.":""));};
 document.getElementById("dlBk").onclick=function(){try{var s=Object.assign({},state);delete s.apiKey;var b=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="app-savvy-backup.json";document.body.appendChild(a);a.click();a.remove();}catch(e){alert("Couldn't download the backup.");}};
 document.getElementById("upBtn").onclick=function(){document.getElementById("upFile").click();};
 document.getElementById("upFile").onchange=function(e){var fl=e.target.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){try{var k=state.apiKey;state=Object.assign(blank(),JSON.parse(rd.result));state.apiKey=k;AI_ON=!!state.apiKey;save();refreshStats();renderKey();}catch(err){alert("That didn't parse as a backup file.");}};rd.readAsText(fl);};
 document.getElementById("wipe").onclick=function(){if(confirm("Erase your progress and key from this browser?")){state=blank();AI_ON=false;save();refreshStats();renderKey();}};
}
/* ===== STARTUP ===== */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.getElementById("levelChip").onclick=()=>setTab("home");
document.getElementById("askFab").onclick=function(){toggleAsk();};
document.getElementById("askClose").onclick=function(){toggleAsk(false);};
let lastQ=-1;
function showQuote(){const el=document.getElementById("qtext");if(!el)return;let i;do{i=Math.floor(Math.random()*QUOTES.length);}while(i===lastQ&&QUOTES.length>1);lastQ=i;const q=QUOTES[i];el.style.opacity=0;setTimeout(function(){el.innerHTML=esc(q.t)+(q.a?` <span style="color:var(--faint);font-style:normal">— ${esc(q.a)}</span>`:"");el.style.opacity=1;},300);}
document.getElementById("qref").onclick=showQuote;
showQuote();setInterval(showQuote,180000);
loadStateAsync().then(function(s){state=s;AI_ON=!!state.apiKey;return GAS?gcall("hasKey").then(function(k){AI_ON=!!k;}).catch(function(){}):null;}).then(function(){refreshStats();if(!state.onboarded){quiz={type:"intake",i:0,answers:[]};}else if(state.resume){restoreResume();}render();});
</script>
