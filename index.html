<style>
  :root{
    --paper:#F1EFE7; --paper-2:#E7E4D9; --card:#FBFAF5; --line:#DEDACD;
    --ink:#2B3A40; --ink-soft:#61727A; --ink-faint:#8B9AA1;
    --dark:#2F4A55; --dark-2:#3E606D;
    --acc:#5891B4; --acc-lt:#A5C8DD; --acc-deep:#3F7295; --acc-soft:rgba(88,145,180,.11);
    --spark:#E3A177; --spark-lt:#F2C9AC; --spark-deep:#C67E4E;
    --sage:#7FA08D;
    --rose:#C1705F;
    --sky1:#DCE9F0; --sky2:#F3E4D6;
    --shadow:0 1px 2px rgba(47,74,85,.05), 0 14px 38px rgba(47,74,85,.10);
    --radius:16px;
  }
    /* ---- the room changes with the hour ---- */
  html{transition:background .9s ease}
  body{transition:background .9s ease,color .9s ease}
  [data-tod="dawn"]{
    --paper:#F6EDE8; --paper-2:#EDDFD8; --card:#FEFAF7; --line:#E3D3C9;
    --acc:#7C86AE; --acc-lt:#B6B9D4; --acc-deep:#5F6A93; --acc-soft:rgba(124,134,174,.12);
    --sky1:#E9DCE9; --sky2:#F7E3D2;
  }
  [data-tod="morning"]{
    --paper:#F1EFE7; --paper-2:#E7E4D9; --card:#FBFAF5; --line:#DEDACD;
  }
  [data-tod="midday"]{
    --paper:#ECF1F3; --paper-2:#DDE6E9; --card:#FAFDFE; --line:#D2DDE1;
    --acc:#4A90B8; --acc-deep:#31749B;
  }
  [data-tod="after"]{
    --paper:#F8EEDD; --paper-2:#EFE0C8; --card:#FEFAF2; --line:#E5D6BA;
    --acc:#B98450; --acc-lt:#E0BE93; --acc-deep:#96683A; --acc-soft:rgba(185,132,80,.13);
    --sky1:#F5E3CE; --sky2:#E3E7DC;
  }
  [data-tod="dusk"]{
    --paper:#EFE7E9; --paper-2:#E3D7DB; --card:#FBF6F7; --line:#DBCBD1;
    --ink:#2E2F3C; --ink-soft:#63637A;
    --acc:#8A7099; --acc-lt:#C0AECB; --acc-deep:#6C5480; --acc-soft:rgba(138,112,153,.13);
  }
  [data-tod="night"]{
    --paper:#16202A; --paper-2:#1E2A36; --card:#1F2C38; --line:#2E3E4C;
    --ink:#E6EDF2; --ink-soft:#A3B6C2; --ink-faint:#748796;
    --dark:#101A23; --dark-2:#1B2A36;
    --acc:#6FA5C6; --acc-lt:#A9CBE0; --acc-deep:#8FBBD6; --acc-soft:rgba(111,165,198,.14);
    --spark:#E0A87F; --spark-lt:#8A6A55; --spark-deep:#E0A87F;
    --shadow:0 1px 2px rgba(0,0,0,.22), 0 16px 42px rgba(0,0,0,.34);
  }

  [data-tod="night"] .ask{color:var(--ink)}
  [data-tod="night"] .cupnum{color:var(--ink)}
  [data-tod="night"] .panel h4{color:var(--ink)}
  [data-tod="night"] .medcard .tx b{color:var(--ink)}
  [data-tod="night"]{--sky1:#22303F; --sky2:#2C3B45}
  [data-tod="night"] .light h2, [data-tod="night"] .banner h2{color:#fff}
  [data-tod="night"] .medcard::before{opacity:.13}
  [data-tod="night"] .med::before{opacity:.13}
  [data-tod="night"] .prompt{background:linear-gradient(160deg,#24384A,#16232F);border:1px solid #2E3E4C}
  [data-tod="night"] .tally{background:linear-gradient(160deg,#24384A,#16232F)}
  [data-tod="night"] .btn.ghost{border-color:#334656}
  [data-tod="night"] .toast{background:#24384A}
  [data-tod="night"] .hint{background:#1B2833;border-color:#31414F}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{background:var(--paper)}
  body{background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;line-height:1.58;-webkit-font-smoothing:antialiased}
  #root{min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--acc-deep)}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
  .serif{font-family:'Spectral',Georgia,serif}
  .display{font-family:'Fraunces',Georgia,serif;letter-spacing:-.016em}

  input[type=text],textarea,select{
    width:100%;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;
    resize:vertical;transition:border-color .15s, box-shadow .15s;
  }
  textarea{line-height:1.6}
  input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(88,145,180,.14);outline:none}
  ::placeholder{color:var(--ink-faint)}
  label.field{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:0 0 7px 2px;letter-spacing:.01em}

  .btn{background:linear-gradient(180deg,var(--acc),var(--acc-deep));color:#fff;border:none;border-radius:13px;
    padding:14px 24px;font-size:15px;font-weight:700;transition:transform .12s, filter .2s;box-shadow:0 6px 18px rgba(88,145,180,.28)}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.42;cursor:default;box-shadow:none}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:500}
  .btn.ghost:hover{background:var(--paper-2);filter:none}
  .btn.warm{background:linear-gradient(180deg,var(--spark),var(--spark-deep));box-shadow:0 6px 18px rgba(227,161,119,.3)}
  .btn.sm{padding:9px 16px;font-size:13.5px;border-radius:11px}
  .btn.wide{width:100%}

  .wrap{max-width:640px;margin:0 auto;padding:0 20px 130px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .eyebrow{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc-deep);font-weight:700;margin-bottom:9px}
  .muted{color:var(--ink-soft)}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:26px 0}

  @media (prefers-reduced-motion:no-preference){
    .settle{animation:settle .5s cubic-bezier(.2,.7,.2,1)}
    @keyframes settle{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  }

  /* ============ shell ============ */
  .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(178deg,var(--dark-2),var(--dark) 92%);
    color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 0}
  .topbar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:100vh;background:var(--dark-2)}
  .tb-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .brand{grid-column:2;text-align:center;cursor:pointer}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;line-height:1.1}
  .brand small{display:block;font-family:'Spectral',serif;font-style:italic;font-size:11.5px;color:var(--acc-lt);margin-top:2px}
  .tb-r{grid-column:3;justify-self:end;display:flex;gap:8px;align-items:center}
  .iconbtn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:#EAF2F6;
    border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
  .nav{display:flex;justify-content:center;gap:24px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:11px;padding-top:9px;border-top:1px solid rgba(255,255,255,.11)}
  .nav button{background:none;border:none;color:rgba(255,255,255,.56);font-size:13.5px;font-weight:500;
    padding:4px 1px 9px;border-bottom:2px solid transparent;transition:color .16s}
  .nav button.on{color:#fff;font-weight:700;border-bottom-color:var(--acc-lt)}
  .nav::-webkit-scrollbar{display:none}.nav button{flex:none;white-space:nowrap}@media(max-width:420px){.nav{gap:15px;justify-content:flex-start}.nav button{font-size:12.5px}.brand h1{font-size:18px}}

  /* light band */

  /* the light band, shared by every page except Still */
  .banner{position:relative;height:168px;padding:0 20px 16px;display:flex;align-items:flex-end;overflow:hidden;
    transition:background .9s ease}
  .banner .sun{position:absolute;width:130px;height:130px;border-radius:50%;top:-38px;right:-18px;
    background:radial-gradient(circle,rgba(255,255,255,.92),rgba(255,255,255,0) 68%)}
  .banner .tod{position:absolute;top:15px;left:20px;font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;opacity:.62}
  .banner h2{position:relative;font-family:'Fraunces',serif;font-size:27px;font-weight:600;line-height:1.14;letter-spacing:-.018em;margin:0}
  .banner h2 em{display:block;font-family:'Spectral',serif;font-style:italic;font-weight:400;font-size:21px;margin-top:4px;opacity:.86}
  .light{position:relative;height:162px;margin:0 -20px 18px;padding:0 20px 16px;display:flex;align-items:flex-end;overflow:hidden}
  .light .sun{position:absolute;width:130px;height:130px;border-radius:50%;top:-38px;right:-18px;
    background:radial-gradient(circle,rgba(255,255,255,.92),rgba(255,255,255,0) 68%)}
  .light .tod{position:absolute;top:15px;left:20px;font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;opacity:.62}
  .light h2{position:relative;font-family:'Fraunces',serif;font-size:27px;font-weight:600;line-height:1.14;letter-spacing:-.018em;margin:0}
  .light h2 em{display:block;font-family:'Spectral',serif;font-style:italic;font-weight:400;font-size:21px;margin-top:4px;opacity:.86}

  /* ============ intake ============ */
  .intake{max-width:560px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top,0px)) 22px 80px}
  .prog{height:3px;background:var(--paper-2);border-radius:4px;overflow:hidden;margin:0 0 26px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-lt));transition:width .45s cubic-bezier(.2,.7,.2,1)}
  .ask{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.018em;margin:0 0 10px;color:var(--dark)}
  .ask em{font-family:'Spectral',serif;font-style:italic;font-weight:400;color:var(--acc-deep)}
  .why{font-family:'Spectral',serif;font-size:17px;font-weight:300;line-height:1.62;color:var(--ink-soft);margin:0 0 20px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:9px 15px;font-size:13.5px;
    color:var(--ink-soft);transition:all .15s}
  .chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-deep);font-weight:700}
  .navrow{display:flex;gap:10px;margin-top:26px;align-items:center}
  .skip{background:none;border:none;color:var(--ink-faint);font-size:13px;text-decoration:underline;padding:8px}

  /* ============ cup ============ */
  .cupwrap{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
  .cup{position:relative;width:132px;height:150px}
  .cup svg{width:100%;height:100%;overflow:visible}
  .cupnum{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:var(--dark);letter-spacing:-.02em;margin-top:10px}
  .cupsub{font-size:13px;color:var(--ink-soft);text-align:center;max-width:34ch;line-height:1.5}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .entry{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .entry:last-child{border-bottom:none}
  .entry .when{font-size:11.5px;font-weight:700;color:var(--acc-deep);flex:none;width:56px;padding-top:3px;line-height:1.35}
  .entry .tx{flex:1}
  .entry .tx p{margin:0;font-size:15px;line-height:1.52}
  .entry .tx em{display:block;font-family:'Spectral',serif;font-style:italic;font-size:13.5px;color:var(--ink-soft);margin-top:3px}
  .entry .del{background:none;border:none;color:var(--ink-faint);font-size:17px;line-height:1;padding:2px 4px;flex:none}
  .entry .del:hover{color:var(--rose)}

  /* ============ vision ============ */
  .panel{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .panel:last-child{border-bottom:none}
  .panel .th{width:54px;height:54px;border-radius:13px;flex:none;position:relative;overflow:hidden}
  .panel .th span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px}
  .panel h4{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;margin:0 0 3px;color:var(--dark);line-height:1.22}
  .panel p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.48}
  .panel .fe{font-size:11.5px;color:var(--sage);margin-top:5px;font-weight:700}

  /* ============ still ============ */
  .medcard{display:flex;gap:14px;align-items:center;padding:15px 16px;border-radius:15px;background:var(--card);
    border:1px solid var(--line);margin-bottom:11px;position:relative;overflow:hidden;text-align:left;width:100%}
  .medcard::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 45%,var(--spark-lt));opacity:.3}
  .medcard .ring{position:relative;width:48px;height:48px;border-radius:50%;flex:none;border:2px solid var(--acc-lt);
    display:flex;align-items:center;justify-content:center}
  .medcard .ring i{width:15px;height:15px;border-radius:50%;background:var(--acc)}
  .medcard .tx{position:relative;flex:1}
  .medcard .tx b{font-family:'Fraunces',serif;font-size:16px;font-weight:600;display:block;line-height:1.22;color:var(--ink)}
  .medcard .tx span{font-size:12.5px;color:var(--ink-soft)}

  .medplay{position:fixed;inset:0;z-index:70;background:linear-gradient(170deg,var(--dark-2),var(--dark));
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center}
  .breath{width:190px;height:190px;border-radius:50%;border:2px solid rgba(165,200,221,.45);
    display:flex;align-items:center;justify-content:center;margin-bottom:34px;position:relative}
  .breath i{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(165,200,221,.6),rgba(88,145,180,.22));
    animation:breathe 11s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.62);opacity:.65}45%{transform:scale(1.12);opacity:1}55%{transform:scale(1.12);opacity:1}}
  @media (prefers-reduced-motion:reduce){.breath i{animation:none;transform:scale(.9)}}
  .medline{font-family:'Spectral',serif;font-size:22px;font-weight:300;line-height:1.55;max-width:22ch;min-height:3.2em}
  .medctl{margin-top:32px;display:flex;gap:12px}
  .medstep{background:none;border:none;color:rgba(255,255,255,.55);font-family:inherit;font-size:12px;
    letter-spacing:.09em;text-transform:uppercase;font-weight:600;padding:6px 4px;transition:color .15s}
  .medstep:hover:not(:disabled){color:#fff}
  .medstep:disabled{opacity:.28}
  .medbar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--acc-lt),rgba(165,200,221,.25));
    width:0;animation:medfill linear forwards}
  @keyframes medfill{from{width:0}to{width:100%}}
  @media (prefers-reduced-motion:reduce){.medbar{display:none}}

  /* ============ companion ============ */
  .pal{position:fixed;z-index:60;width:54px;height:54px;border-radius:50%;border:none;padding:0;
    background:linear-gradient(155deg,var(--acc-lt),var(--acc));
    box-shadow:0 8px 24px rgba(88,145,180,.42);display:flex;align-items:center;justify-content:center;
    transition:right .9s cubic-bezier(.3,.7,.3,1), bottom .9s cubic-bezier(.3,.7,.3,1), transform .2s}
  .pal:active{transform:scale(.93)}
  .pal i{width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.94);
    box-shadow:0 0 15px rgba(255,255,255,.8);animation:bob 4.5s ease-in-out infinite}
  .bub{position:fixed;z-index:59;max-width:230px;background:var(--card);border:1px solid var(--line);
    border-radius:16px 16px 5px 16px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--ink);
    box-shadow:0 10px 28px rgba(47,74,85,.16);transition:right .9s, bottom .9s}
  .bub b{color:var(--acc-deep)}


  /* Grace steps aside while you're writing */
  .pal{transition:right .9s cubic-bezier(.3,.7,.3,1), bottom .9s cubic-bezier(.3,.7,.3,1), transform .25s, opacity .25s}
  .pal.away{opacity:0;transform:scale(.6) translateY(10px);pointer-events:none}

  /* her room: a scrolling thread with the writing box pinned under it */
  .graceroom{display:flex;flex-direction:column;max-height:86vh}
  .gracethread{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 0 4px;min-height:0}
  .graceinput{flex:none;padding-top:10px;border-top:1px solid var(--line);background:var(--paper)}
  @media (max-width:999px){
    .graceroom{max-height:88vh}
    .gracethread{max-height:52vh}
    .pal{width:50px;height:50px}
  }
  .sheet{position:fixed;inset:0;z-index:80;background:rgba(43,58,64,.42);display:flex;align-items:flex-end;justify-content:center}
  .sheetin{background:var(--paper);border-radius:22px 22px 0 0;width:100%;max-width:640px;
    padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(47,74,85,.2)}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));
    background:var(--dark);color:#fff;padding:12px 20px;border-radius:24px;font-size:13.5px;z-index:99;
    box-shadow:0 10px 34px rgba(47,74,85,.32)}

  .hint{font-size:12.5px;color:var(--ink-soft);background:var(--paper-2);border:1px dashed var(--line);
    border-radius:12px;padding:12px 14px;line-height:1.55}

  /* ============================================================
     Desktop. Below 1000px nothing here applies and the phone
     layout stands exactly as it was.
     ============================================================ */
  @media (min-width:1000px){

    /* the top bar becomes a rail down the left */
    body{padding-left:250px}
    .topbar{
      position:fixed; left:0; top:0; bottom:0; width:250px; z-index:40;
      padding:30px 20px calc(24px + env(safe-area-inset-bottom,0px));
      display:flex; flex-direction:column;
      border-right:1px solid rgba(255,255,255,.09);
      box-shadow:2px 0 26px rgba(15,36,64,.10);
    }
    .topbar::before{display:none}
    .tb-row{display:block}
    .brand{grid-column:auto; text-align:left}
    .brand h1{font-size:26px; line-height:1.05}
    .brand small{font-size:12.5px; margin-top:5px}
    .tb-r{grid-column:auto; justify-self:auto; margin-top:auto; padding-top:22px}
    .iconbtn{padding:8px 14px; font-size:12px}
    .nav{
      flex-direction:column; align-items:stretch; justify-content:flex-start;
      gap:3px; margin-top:30px; padding-top:22px; overflow:visible;
      border-top:1px solid rgba(255,255,255,.11);
    }
    .nav button{
      width:100%; text-align:left; font-size:15px; font-weight:500;
      padding:11px 13px; border-radius:11px; border-bottom:none;
      transition:background .16s, color .16s;
    }
    .nav button:hover{background:rgba(255,255,255,.07); color:rgba(255,255,255,.85)}
    .nav button.on{background:rgba(255,255,255,.13); color:#fff; border-bottom:none}


    /* settings sits at the foot of the rail */
    .tb-row{display:contents}
    .topbar .brand{order:1}
    .topbar .nav{order:2}
    .topbar .tb-r{order:3;margin-top:auto;padding-top:22px;justify-self:start}

    /* the whole cup header travels together */
    .view-cup > .cuphead{grid-column:1;position:sticky;top:34px;padding-top:26px}
    .view-cup > .cupwrap,
    .view-cup > .btn.warm,
    .view-cup > .cupabout{grid-column:auto}

    /* the shared banner spans the content area */
    .banner{height:230px;padding:0 40px 24px;margin:0}
    .banner .tod{left:40px;top:20px}
    .banner h2{font-size:34px}
    .banner h2 em{font-size:25px}

    /* room to breathe */
    .wrap{max-width:1120px; padding:0 40px 120px; margin:0 auto}
    .light{margin:0 -40px 26px; height:220px; padding:0 40px 22px}
    .light h2{font-size:34px}
    .light h2 em{font-size:25px}

    /* ---------- Today: question and gratitude left, proof right ---------- */
    .view-today{display:grid; grid-template-columns:1.15fr .85fr; gap:0 34px; align-items:start}
    .view-today > .light{grid-column:1 / -1}
    .view-today > *{grid-column:1}
    .view-today > .proofcol{grid-column:2; grid-row:2 / span 99; position:sticky; top:34px}

    /* ---------- The Cup: cup stays put, entries scroll beside it ---------- */
    .view-cup{display:grid; grid-template-columns:330px 1fr; gap:0 40px; align-items:start}
    .view-cup > *{grid-column:2}
    .view-cup > .cupwrap,
    .view-cup > .btn.warm,
    .view-cup > .cupabout{grid-column:1}
    .view-cup > .cupwrap{position:sticky; top:34px; padding-top:26px}
    .cupgrid{display:grid; grid-template-columns:1fr; gap:0}
    .view-cup .entry:first-child{padding-top:0}

    /* ---------- Vision: a real board ---------- */
    .vgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; align-items:start}
    .vgrid > .panel{border-bottom:none; background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:15px 16px; margin:0}

    /* ---------- Still: shelves of cards ---------- */
    .shelf{display:grid; grid-template-columns:repeat(3,1fr); gap:13px}
    .shelf > .eyebrow{grid-column:1 / -1; margin-bottom:0}
    .shelf > .medcard{margin-bottom:0; height:100%}

    /* ---------- Journal: cards, not a list ---------- */
    .jgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
    .jgrid > .entry{border-bottom:none; background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:16px 17px}

    /* keep prose readable even in a wide column */
    .view-today .prompt .q, .writeq{max-width:34ch}
    .cupabout p, .medplay .medline{max-width:62ch}

    /* the sheets sit over the content area, not the rail */
    .sheet{left:250px}
    .sheetin{border-radius:22px; max-width:620px; margin-bottom:5vh; max-height:82vh}

    /* companion clear of the rail */
    .pal{right:32px; bottom:32px}
  }

  @media (min-width:1500px){
    .wrap{max-width:1320px}
    .vgrid{grid-template-columns:repeat(3,1fr)}
    .shelf{grid-template-columns:repeat(4,1fr)}
  }

</style>

const QTAGS = ["scarcity", "present", "scarcity", "still", "still", "gratitude", "scarcity", "gratitude", "scarcity", "scarcity", "scarcity", "notice", "scarcity", "present", "gratitude", "vision", "gratitude", "notice", "still", "vision", "present", "gratitude", "notice", "gratitude", "notice", "vision", "scarcity", "notice", "scarcity", "still", "growth", "growth", "growth", "growth", "growth", "growth", "growth", "growth"];
const WHY_MAP = {
  'I want to stop living braced for the worst': { themes:['scarcity'], meds:['alarm','manna','nothing'] },
  'I want to be more present':                  { themes:['present'],  meds:['leaves','five','here'] },
  'I want to feel grateful instead of behind':  { themes:['gratitude'],meds:['manna','earn','openhand'] },

};
function whyThemes(why){
  var t=[]; (why||[]).forEach(function(w){ var m=WHY_MAP[w]; if(m) m.themes.forEach(function(x){ if(t.indexOf(x)<0) t.push(x); }); });
  return t;
}
function whyMeds(why){
  var ids=[]; (why||[]).forEach(function(w){ var m=WHY_MAP[w]; if(m) m.meds.forEach(function(x){ if(ids.indexOf(x)<0) ids.push(x); }); });
  return ids.map(function(id){ return MEDS.filter(function(m){return m.id===id;})[0]; }).filter(Boolean).slice(0,4);
}

function timeOfDay() {
  const h = new Date().getHours();
  if (h < 6) return {
    k: 'night',
    label: 'Before dawn',
    s1: '#3A4E63',
    s2: '#5A6C7E',
    dark: true,
    greet: 'You’re up early'
  };
  if (h < 9) return {
    k: 'dawn',
    label: 'Early light',
    s1: '#E9DCE9',
    s2: '#F7E3D2',
    dark: false,
    greet: 'Good morning'
  };
  if (h < 12) return {
    k: 'morning',
    label: 'Morning',
    s1: '#DCE9F0',
    s2: '#F3E4D6',
    dark: false,
    greet: 'Good morning'
  };
  if (h < 16) return {
    k: 'midday',
    label: 'Midday',
    s1: '#D7E7F2',
    s2: '#EFF1E6',
    dark: false,
    greet: 'Good afternoon'
  };
  if (h < 19) return {
    k: 'after',
    label: 'Late light',
    s1: '#F5E3CE',
    s2: '#E3E7DC',
    dark: false,
    greet: 'Good afternoon'
  };
  if (h < 22) return {
    k: 'dusk',
    label: 'Dusk',
    s1: '#E7D0C6',
    s2: '#BFD0DC',
    dark: false,
    greet: 'Good evening'
  };
  return {
    k: 'night',
    label: 'Night',
    s1: '#33485C',
    s2: '#4E6274',
    dark: true,
    greet: 'Good evening'
  };
}

/* ============================ content ============================ */
const QUESTIONS = ["Why has there always been enough?", "What did you make room for today?", "Where did provision show up this week — even something small?", "What can you close the laptop on tonight?", "What are you holding that isn’t actually yours to carry?", "Who showed up for you recently, without being asked?", "What would today look like if you believed you were already held?", "What’s one thing you have now that a younger you longed for?", "What did you survive that you were sure you wouldn’t?", "What are you afraid of losing — and who kept it safe last time?", "Where were you fed when you didn’t know how you’d be fed?", "What’s good right now, in this actual hour?", "What has never once run out?", "What are you rushing past that deserves a longer look?", "If nothing changed for a year, what would still be worth thanking God for?", "What are you seeking that can’t actually satisfy?", "Who in your life would be glad to hear from you today?", "What did you do today that no one saw?", "What’s one worry you can hand over before you sleep?", "What’s already true about the life you’re praying toward?", "When did you last feel unhurried? What made it possible?", "What’s the smallest kindness you received this week?", "What would you tell a friend who was carrying what you’re carrying?", "What has God been faithful in, that you’ve stopped noticing?", "What are you proud of that you’d never say out loud?", "Where is there more room in your life than you’re admitting?", "What are you afraid isn’t enough — and is it, actually?", "What’s worth celebrating today, even if it’s small?", "What did you let go of, and how did it turn out?", "What would rest look like today, in a form you’d actually take?", "What are you bad at right now that you want to be good at?", "What can you do now that you couldn’t do two years ago?", "What did this week teach you that you didn’t want to learn?", "Where are you protecting yourself from being a beginner?", "What did you get wrong recently, and what did it show you?", "What are you calling a weakness that is really just inexperience?", "What would you try if a first attempt were allowed to be clumsy?", "What has become easy that used to take everything you had?"];
const CATS = [["present", "Coming back to now", "Are you somewhere other than here?"], ["thoughts", "When your mind won’t stop", "Is your mind going round and round?"], ["skills", "Skills for a hard moment", "Is this a hard moment, right now?"], ["somatic", "In the body", "Is it sitting in your body?"], ["learning", "When you’re learning something hard", "Are you learning something hard?"], ["money", "When the dread comes", "Has the worry arrived?"], ["receiving", "Letting yourself be filled", "Is it hard to let yourself be given to?"], ["rest", "Putting the day down", "Are you ready to put the day down?"], ["outdoors", "Outside, on your feet", "Can you get outside?"]];
const MEDS = [{"id": "nothing", "cat": "present", "title": "Nothing is wrong right now", "mins": 4, "blurb": "A body scan for a mind that’s scanning ahead.", "lines": [["Let’s begin by simply arriving. You don’t need to fix anything in the next five minutes.", 6], ["Let your breath out slowly. All the way out.", 7], ["Now let it come back in on its own. You don’t have to manage it.", 8], ["Notice where you’re sitting. Feel the weight of you held by the chair, the bed, the floor.", 9], ["Something is holding you up right now, and it isn’t you.", 8], ["Let your shoulders drop. They’ve been up for a while.", 8], ["Unclench your jaw. Let your tongue rest.", 7], ["Soften your hands.", 6], ["Now, gently, take stock of this exact moment. Not this week. Not tonight. This minute.", 9], ["In this minute, is anything actually on fire?", 9], ["Your mind will want to answer with the future. Let it, and then come back.", 8], ["Right now, in this room, you are safe. You are breathing. You are held.", 9], ["Stay here a moment longer.", 10], ["When you’re ready, open your eyes. Nothing is wrong right now.", 6]]}, {"id": "five", "cat": "present", "title": "Five things", "mins": 4, "blurb": "Senses first. The fastest way back into the room.", "lines": [["Keep your eyes open for this one. We’re coming back through the senses.", 6], ["Look around and find five things you can see. Take them one at a time.", 13], ["Notice the colour of one of them. Really look.", 8], ["Now four things you can feel. Your feet in your shoes. Fabric. Air on your skin. The chair.", 13], ["Press your feet into the floor and feel that.", 7], ["Three things you can hear. Let the far-away ones count.", 12], ["Two things you can smell — or if there’s nothing, two you like the smell of.", 10], ["And one thing you can taste, or the way your mouth feels right now.", 8], ["That’s it. That’s the whole exercise.", 6], ["Your mind went somewhere else. Your senses were here the whole time.", 8], ["You can do this in a checkout line, in a meeting, in a car. Nobody can tell.", 6]]}, {"id": "here", "cat": "present", "title": "Here with them", "mins": 2, "blurb": "Two minutes before you walk into the room.", "lines": [["Before you walk in, stop where you are.", 6], ["One breath, all the way out.", 7], ["Whatever you were just thinking about — it can wait on this side of the door.", 8], ["The person in there is not a task.", 8], ["Picture their face. Just their face.", 8], ["You don’t need to bring them anything. You only need to be in the room.", 9], ["One more breath.", 7], ["Now go in, and stay all the way in.", 5]]}, {"id": "leaves", "cat": "thoughts", "title": "Leaves on a stream", "mins": 6, "blurb": "Let each thought float past instead of arguing with it.", "lines": [["Sit comfortably and let your eyes close, if that’s alright.", 7], ["Take one slow breath out, and let your shoulders come down with it.", 8], ["Picture a stream. Slow-moving, clear, with leaves drifting along the surface.", 10], ["It can be anywhere. A creek in the woods, a ditch after rain. Whatever your mind offers.", 9], ["Now, for the next few minutes, whatever thought shows up, place it on a leaf. And let it float.", 11], ["A worry about tomorrow. Onto a leaf. Let it go downstream.", 11], ["A thing you should have said. Onto a leaf.", 11], ["Don’t argue with the thought. Don’t fix it. Don’t finish it. Just set it on the water.", 11], ["Pleasant thoughts too. Those go on leaves as well.", 10], ["If a thought comes back, that’s fine. Put it on another leaf.", 11], ["At some point you’ll notice you’ve been swept along with one — thinking it instead of watching it.", 10], ["That’s not failure. That’s the practice. Step back onto the bank and start again.", 11], ["You are not the stream. You’re the one sitting beside it.", 12], ["Keep going a little longer, in your own time.", 20], ["When you’re ready, let the stream go, and come back to the room.", 7], ["Your thoughts were never orders. They were only ever leaves.", 6]]}, {"id": "train", "cat": "thoughts", "title": "The passing train", "mins": 5, "blurb": "You’re on the platform. You don’t have to board.", "lines": [["Close your eyes and take one long breath out.", 8], ["Picture yourself standing on a station platform. It’s quiet. You’re not going anywhere.", 10], ["A train pulls in. Each car has words written on the side — one of your thoughts.", 11], ["Read one as it passes. Don’t climb on.", 11], ["Here comes another. The one about money. Let it roll by.", 11], ["The one about what someone thinks of you. Let it pass.", 11], ["You don’t have to fight the train. You don’t have to stop it. You just don’t get on.", 11], ["Some cars go by slowly. Some you’ll want to board out of habit.", 10], ["If you find yourself already on one — halfway down the track, deep in a thought — just step off.", 11], ["Back on the platform. Nothing lost.", 11], ["Trains keep coming. That’s what they do. That’s what minds do.", 11], ["Stay on the platform a while longer.", 16], ["When you’re ready, come back. Notice how quiet the platform was the whole time.", 6]]}, {"id": "thought", "cat": "thoughts", "title": "I’m having the thought that…", "mins": 4, "blurb": "Six words that put half an inch between you and it.", "lines": [["Bring to mind the thought that’s loudest right now.", 9], ["Don’t soften it. Say it to yourself the harsh way it actually arrives.", 9], ["Something like: I’m not doing enough. Or, this is all going to fall apart.", 9], ["Now say the same thing again, but put six words in front of it.", 8], ["I’m having the thought that… and then the thought.", 11], ["Say it again that way, slowly.", 11], ["Notice what changed. The thought is still there. You’re just no longer standing inside it.", 10], ["Now try one more layer. I notice I’m having the thought that…", 11], ["A little more room, isn’t there.", 9], ["You haven’t argued with it. You haven’t proven it wrong. You’ve only stopped being it.", 10], ["That half an inch is where you get to choose what happens next.", 9], ["One breath out, and come back.", 6]]}, {"id": "radio", "cat": "thoughts", "title": "The radio in the other room", "mins": 5, "blurb": "For background worry that never quite turns off.", "lines": [["Sit down and let your eyes close.", 7], ["Somewhere in the back of your mind, something has been playing all day.", 9], ["Low, constant, just under the surface. A running commentary about what might go wrong.", 10], ["Picture it as a radio in another room of the house.", 10], ["You can hear it. You can’t quite make out every word. It’s been on for years.", 10], ["Here’s the thing: you don’t have to go turn it off.", 10], ["You’ve tried. It comes back on. That’s not a character flaw.", 9], ["Instead, stay in this room. Notice what’s in here.", 10], ["The sound of your own breath, closer than the radio.", 11], ["The weight of your body in the chair, closer than the radio.", 11], ["The radio can keep playing. You can still be here.", 11], ["This is what most peace actually looks like. Not silence. Just distance.", 10], ["Stay in this room a little longer.", 15], ["When you’re ready, come back. You can leave it playing.", 6]]}, {"id": "alarm", "cat": "money", "title": "The alarm without the fire", "mins": 4, "blurb": "For when the dread comes and your hands want to check something.", "lines": [["Something has set off the alarm. Let’s not argue with it. Let’s just sit beside it.", 8], ["First, breathe out longer than you breathe in. Four in.", 5], ["And a long six out.", 8], ["Again. In, four.", 5], ["Out, six. Long and slow.", 9], ["Now, notice the alarm without obeying it.", 7], ["It wants you to do something. Check a number. Make a plan. Fix it tonight.", 8], ["You don’t have to. Not in the next five minutes.", 8], ["The feeling is real, and it is not new. It learned its job a long time ago, when it was needed.", 10], ["You can thank it for the years it kept you alert.", 8], ["And you can tell it, gently, that you’re not in that season anymore.", 9], ["Feel your feet on the floor. Press down.", 8], ["The alarm can sound without a fire. Both things can be true.", 9], ["Breathe out, long.", 8], ["Nothing needs to be decided right now. When you open your eyes, don’t check anything for ten minutes.", 7]]}, {"id": "manna", "cat": "money", "title": "Enough for today", "mins": 5, "blurb": "On daily bread, and why it was never meant to be stored.", "lines": [["Sit, and let one long breath go.", 8], ["There’s an old story about people in a desert who were fed every morning.", 9], ["Bread on the ground at dawn. Enough for that day.", 9], ["They were told to gather what they needed and not to store it up.", 9], ["Some of them stored it anyway. Anyone would.", 9], ["And what they hoarded spoiled by morning. But the ground was covered again.", 10], ["Sit with that a moment. Not as a lesson. Just as a picture.", 11], ["Enough arrived. Every day. Even for the ones who didn’t trust it would.", 11], ["Now think about your own life, and be honest.", 9], ["Has there been a single day you went without what you actually needed?", 12], ["Not what you feared you’d need. What you needed.", 11], ["Breathe out.", 8], ["Today has enough in it. You are allowed to eat today’s bread today.", 10], ["Tomorrow will have its own. It always has.", 11], ["Stay here a moment.", 12], ["When you’re ready, come back — with your hands a little more open.", 6]]}, {"id": "openhand", "cat": "money", "title": "The open hand", "mins": 4, "blurb": "Holding what you have without gripping it.", "lines": [["Rest your hands in your lap, palms down, and take a breath out.", 8], ["Now make a fist with one hand. Not hard. Just closed.", 9], ["That’s how we hold the things we’re afraid to lose.", 9], ["Notice that a closed hand can’t receive anything either.", 10], ["Keep it closed a moment longer, and feel what that costs.", 10], ["Now, slowly, let it open. Turn the palm up.", 9], ["Nothing fell out. Notice that.", 9], ["An open hand can still hold. It just isn’t gripping.", 10], ["Think of one thing you’re holding tightly right now.", 11], ["You don’t have to give it away. Just loosen your fingers around it.", 11], ["What you have was given. What you need will be.", 11], ["Both palms up now. Stay like that for a few breaths.", 14], ["When you’re ready, come back. Try to carry the day this way.", 6]]}, {"id": "cup", "cat": "receiving", "title": "Fill my cup", "mins": 6, "blurb": "The woman at the well — on being sought, and being filled.", "lines": [["Come and sit. This one is slower.", 7], ["Breathe out, and let the day fall off your shoulders.", 8], ["There was a woman who went to a well at noon, in the heat, when nobody else would be there.", 10], ["She went at that hour because of what people knew about her.", 9], ["And when she got there, someone was already waiting.", 9], ["He asked her for a drink. That was all. He asked her for something.", 9], ["He didn’t begin with what was wrong with her.", 9], ["Sit with that for a moment. He began by needing something from her.", 10], ["Then He offered her water she wouldn’t have to keep coming back for.", 9], ["Think about what you keep coming back for. What you keep drawing up, that never quite fills you.", 11], ["A number. A title. Someone’s approval. Certainty about next year.", 10], ["Breathe out.", 7], ["Now imagine holding out an empty cup. Not earning it. Just holding it out.", 10], ["You don’t have to fill it yourself. That has never been your job.", 10], ["Stay here with your hands open.", 11], ["Fill my cup. Come and quench this thirsting of my soul.", 10], ["When you’re ready, come back slowly. Carry the cup with you.", 7]]}, {"id": "earn", "cat": "receiving", "title": "You don’t have to earn today", "mins": 5, "blurb": "For anyone who has been paying their way since they were small.", "lines": [["Sit down, and let your hands rest open.", 8], ["Some of us learned early that you keep your place by being useful.", 9], ["That if you produce, you get to stay. That love has an invoice.", 10], ["If that’s you, notice you’re probably already tensed for the next task.", 10], ["Let your shoulders come down.", 8], ["Here is the strange thing about grace. It arrives before the work.", 10], ["It ran to meet the son while he was still rehearsing his apology.", 11], ["You cannot get further ahead of it by working harder.", 11], ["Say this to yourself, even if you don’t feel it yet: I am not being billed for today.", 12], ["Again, slower.", 11], ["Whatever you get done today, you will be exactly as held tonight as you are right now.", 11], ["Sit in that a moment. It may feel unfamiliar. Let it.", 13], ["When you’re ready, come back. Today is already paid for.", 6]]}, {"id": "letin", "cat": "receiving", "title": "Let someone in", "mins": 4, "blurb": "Before you text the friend you’ve been meaning to text.", "lines": [["Take a breath, and bring one person to mind. Someone who knows you.", 9], ["Not the person who needs you. The person who likes you.", 10], ["Notice what comes up. For a lot of us, it’s a reason not to reach out.", 10], ["They’re busy. It’s been too long. You’d be a burden.", 10], ["Now flip it. When someone you love reaches out to you — are you burdened?", 11], ["You’re glad. Every time.", 9], ["Let it be true in both directions.", 10], ["Picture them hearing from you. Picture their face when they see your name.", 11], ["You don’t have to have news. You don’t have to be doing well.", 10], ["One breath out.", 8], ["Now open your eyes, and send the message before you talk yourself out of it.", 5]]}, {"id": "setdown", "cat": "rest", "title": "Setting it down", "mins": 3, "blurb": "An evening practice for closing the laptop.", "lines": [["The day is done, whether or not it’s finished. Those are different things.", 8], ["Take one slow breath and let the shoulders come down with it.", 8], ["Picture what you’re still carrying. Don’t list it. Just feel the weight of it.", 9], ["Now picture setting it on a table in front of you.", 8], ["It’s still there. You’re not pretending it’s gone. You’re just not holding it.", 9], ["The work will be on the table in the morning. It keeps.", 8], ["Breathe out.", 7], ["Now think of one thing that went right today. Small counts.", 9], ["Let yourself actually feel glad about it, for three whole breaths.", 10], ["The evening in front of you is yours. Nothing is required of you in it.", 9], ["When you open your eyes, leave it on the table.", 6]]}, {"id": "sabbath", "cat": "rest", "title": "The week ends here", "mins": 4, "blurb": "For sundown, or any threshold between working and resting.", "lines": [["Wherever you are, stop. This is a threshold.", 8], ["One long breath out. Let it take some of the week with it.", 9], ["Behind you is everything you did and didn’t get to.", 9], ["Both of those are finished now. Not completed — finished.", 10], ["Name one thing you’re leaving unfinished, and leave it anyway.", 12], ["The world will keep turning without your attention on it. It always has.", 10], ["Rest isn’t what you get after you’ve earned it. It’s what you were made for.", 11], ["Breathe out again.", 9], ["Now let something good in. Think of who you’ll be near in the next day.", 11], ["Think of what you’ll eat, what you’ll hear, where the light will be.", 11], ["You’re not stepping away from your life. You’re stepping into it.", 11], ["Stay in this doorway a moment longer.", 13], ["When you’re ready, cross it. The week ended here.", 6]]}, {"id": "sleep", "cat": "rest", "title": "When you can’t sleep", "mins": 6, "blurb": "Long, slow, and no pressure to actually fall asleep.", "lines": [["Stay lying down. Nothing here needs your effort.", 9], ["First, let go of the goal. You do not have to fall asleep.", 10], ["Rest is worth something on its own, even awake. That takes the pressure off.", 11], ["Now breathe out slowly, longer than you breathed in.", 10], ["Again. And let the out-breath be the whole job.", 11], ["Feel where your body meets the bed. The back of your head.", 11], ["Your shoulders. Let them be heavy.", 11], ["Your hands. Let them be heavy.", 11], ["Your hips, your legs, your heels.", 12], ["Heavier with each breath out.", 12], ["Your mind will keep offering you tomorrow. That’s alright.", 10], ["Each time, say: not now. And come back to the out-breath.", 12], ["Not now.", 12], ["There is nothing you can solve at this hour that will not be easier in the morning.", 12], ["Let the breath get slow.", 16], ["Heavy, and slow, and here.", 18], ["Nothing more is required of you tonight.", 14]]}, {"id": "walk", "cat": "outdoors", "title": "A slow walk", "mins": 6, "blurb": "Outdoors, on your feet. No destination.", "lines": [["Start walking, slower than usual. Slower than feels natural.", 10], ["You’re not going anywhere. That’s the whole point of this walk.", 10], ["Feel your heel land. Then the middle of your foot. Then the push off your toes.", 12], ["Again, with the other foot. Heel, middle, toes.", 12], ["Let your breath find its own rhythm with your steps. Don’t force it.", 12], ["Now look up and out. Not at your feet.", 10], ["Find something green and let your eyes rest on it as you pass.", 12], ["Notice the temperature on your face and hands.", 12], ["Notice the sound your own steps make.", 12], ["Your mind will start planning. It always does on a walk.", 10], ["When you notice it, come back to your heels.", 12], ["Heel, middle, toes.", 13], ["There is nowhere you need to be for the next few minutes.", 13], ["Keep walking. Let it be slow.", 25], ["When you’re ready, let your pace come back up — but keep your eyes up too.", 7]]}, {"id": "sky", "cat": "outdoors", "title": "Under the sky", "mins": 4, "blurb": "Step outside and look up. That’s most of it.", "lines": [["Go outside, and stand still.", 10], ["Now look up. All the way up.", 11], ["Take in how much of it there is. It goes on well past what you can see.", 12], ["Breathe in the outside air, and let it out slowly.", 11], ["Whatever has been filling your mind — hold it up against that.", 12], ["It doesn’t make your problems small. It just puts them somewhere.", 11], ["The sky has been doing this over your whole life. Over every hard season you’ve had.", 12], ["It was there over the worst week you can remember.", 11], ["And it’s here now, over an ordinary day you got to have.", 12], ["Stay looking up a little longer.", 16], ["Now bring your eyes back to the ground, and take that with you inside.", 6]]}, {"id": "tree", "cat": "outdoors", "title": "The tree", "mins": 5, "blurb": "Find a tree. Stand near it. Weather passes; roots don’t.", "lines": [["Find a tree you can stand near, or sit under. Any tree.", 11], ["Take one breath out and let your feet settle.", 10], ["Look at it for a moment without doing anything else.", 12], ["Notice that most of it is holding still while the top of it moves.", 12], ["Wind goes through the branches. The trunk barely registers it.", 12], ["That’s not because the tree is strong. It’s because it’s rooted.", 12], ["Now feel your own feet. Press them down.", 11], ["Let the weather move through the top of you. Thoughts, worry, the day.", 12], ["Let it move. You don’t have to stop it.", 12], ["And keep your weight low and still.", 13], ["This tree has been through storms you’d have called unsurvivable. It’s standing here.", 12], ["So are you.", 13], ["Stay a little longer.", 17], ["When you go back in, walk the way the trunk stands.", 6]]}, {"id": "water", "cat": "outdoors", "title": "Moving water", "mins": 5, "blurb": "By a creek, a lake, the rain — anywhere water is moving.", "lines": [["Find the water and let your eyes rest on it.", 11], ["Don’t follow one spot. Let your gaze go soft and take in the movement.", 12], ["Breathe out slowly.", 10], ["The water isn’t working at this. It’s just going where it goes.", 12], ["Notice it moves around what it can’t move through.", 12], ["It doesn’t stop at the rock. It doesn’t argue with the rock.", 12], ["Let your breath get as unhurried as what you’re watching.", 13], ["Whatever you came out here carrying — put it on the water.", 13], ["Watch it go where the water goes.", 15], ["Water has been doing this since long before your family had a name.", 12], ["Stay as long as you like.", 18], ["When you go, go slowly.", 6]]}, {"id": "stop", "cat": "skills", "title": "STOP", "mins": 4, "blurb": "DBT · four moves before you react to something.", "lines": [["Something just landed. Before you answer it, we’re going to do four things.", 8], ["First: stop. Don’t move. Not your hands, not your mouth.", 9], ["Whatever the urge is — to reply, to fix, to check — freeze it for one minute.", 10], ["Second: take a step back. Physically, if you can. Or just in your mind.", 10], ["Breathe out slowly. You are not required to be inside this yet.", 11], ["Third: observe. What is actually happening right now, in facts only?", 11], ["Not what it means. Not what it will lead to. Just what is true this minute.", 12], ["And notice what your body is doing. Jaw, shoulders, stomach.", 11], ["Fourth: proceed mindfully. Ask what response you’d respect tomorrow.", 12], ["Not the one that gets rid of this feeling fastest.", 11], ["One more breath out.", 9], ["Now go — slower than the urge wanted you to.", 6]]}, {"id": "paced", "cat": "skills", "title": "Paced breathing", "mins": 5, "blurb": "DBT · the fastest way to turn the body’s volume down.", "lines": [["This one works on the body first. The mind follows later.", 8], ["Sit up, both feet down, and let your hands rest.", 8], ["We’re making the out-breath longer than the in-breath. That’s the whole trick.", 10], ["Breathe in for four. One, two, three, four.", 6], ["Out for six. One, two, three, four, five, six.", 9], ["Again. In for four.", 6], ["Out for six, slow.", 9], ["In.", 6], ["Out, longer.", 10], ["Keep it going. If you get lightheaded, let the breath get smaller, not faster.", 11], ["In.", 6], ["Out.", 10], ["Now add this: on the out-breath, let one muscle go. Start with your jaw.", 11], ["Next breath, your shoulders.", 10], ["Next, your hands.", 10], ["Next, your stomach.", 11], ["Four more on your own, as slow as you can make them.", 22], ["That’s your nervous system, turned down a notch. You did that.", 6]]}, {"id": "wisemind", "cat": "skills", "title": "Wise mind", "mins": 5, "blurb": "DBT · the place between the feeling and the argument.", "lines": [["Close your eyes and let one breath out.", 8], ["There’s a part of you that runs on feeling. It’s loud, it’s fast, and it isn’t wrong.", 10], ["There’s another part that runs on logic. Lists, plans, evidence. Also not wrong.", 11], ["Most decisions get made by whichever one is shouting.", 10], ["There’s a third place where those two overlap. That’s the one we’re looking for.", 11], ["Take the question you’re sitting with, and hold it lightly.", 11], ["First, let the feeling part answer. Don’t judge it. Just listen.", 13], ["Now let the logical part answer.", 13], ["Now drop the question lower — into your chest, or your gut, wherever quiet answers live.", 12], ["Ask it there, and then stop talking.", 16], ["The answer from that place is usually shorter. Often it’s something you already knew.", 12], ["You don’t have to act on it yet. Just notice it came from somewhere steadier.", 11], ["One breath out, and come back.", 6]]}, {"id": "facts", "cat": "skills", "title": "Check the facts", "mins": 6, "blurb": "CBT · what you know, versus what you fear.", "lines": [["Take the thought that’s scaring you and say it plainly, once.", 11], ["Now we’re going to do something unglamorous. We’re going to check it.", 9], ["First: what is the actual evidence that this is true? Facts only.", 14], ["Things you could point to. Not feelings, not patterns you’ve noticed in yourself.", 13], ["Now: what’s the evidence against it?", 14], ["Be as fair to this side as you were to the other. Most of us aren’t.", 13], ["Now, honestly — is the thing you fear certain, or is it possible?", 12], ["Those are very different, and your body treats them the same.", 11], ["If the worst did happen, name one thing you would actually do about it.", 14], ["Not the whole plan. One thing.", 11], ["Notice you just proved you could respond. That’s usually what fear is really asking.", 12], ["Last question. What would you tell a friend who brought you this exact worry?", 14], ["Say that to yourself now, in the same tone you’d use with them.", 13], ["One breath out. The facts are usually smaller than the dread.", 6]]}, {"id": "thenwhat", "cat": "skills", "title": "And then what?", "mins": 5, "blurb": "CBT · walking the fear all the way to the end.", "lines": [["We usually stop the worry halfway. Right at the scariest picture.", 9], ["That’s why it keeps its power. So today we walk it to the end.", 10], ["Say the fear out loud, or in your head. The specific one.", 11], ["Now: if that happened — and then what?", 13], ["Play it forward honestly. What would the next week look like?", 14], ["And then what?", 13], ["Keep going. A month out. Who would still be there. What would you still have.", 15], ["And then what?", 13], ["Notice something. You are still in the story. You didn’t disappear.", 12], ["In every version, there’s a you on the other side of it, doing the next thing.", 13], ["That person has been through worse than this, and you know their name.", 12], ["The fear was never that it would happen. It was that you wouldn’t survive it.", 12], ["You would. You have.", 11], ["Come back now. One long breath out.", 6]]}, {"id": "friend", "cat": "skills", "title": "The way you’d speak to a friend", "mins": 5, "blurb": "Self-compassion · the voice you use on everyone but yourself.", "lines": [["Bring to mind the thing you’ve been hard on yourself about today.", 10], ["Now listen to how you say it internally. The actual words. The tone.", 11], ["Would you say that sentence, in that tone, to someone you love?", 12], ["Not a chance. You’d be appalled if someone spoke to them that way.", 11], ["So let’s try it the other way.", 9], ["Picture a friend sitting across from you, telling you this exact thing about themselves.", 12], ["What would you say first?", 14], ["Say it now, out loud if you can, with your own name in it.", 14], ["Notice how strange it feels to be on the receiving end.", 11], ["That strangeness is worth noticing. It means this has been one-directional for a long time.", 11], ["You are not letting yourself off the hook. Kindness and honesty go together fine.", 11], ["One breath out.", 9], ["Speak to yourself all week the way you just did.", 6]]}, {"id": "accept", "cat": "skills", "title": "Radical acceptance", "mins": 6, "blurb": "DBT · for the thing you cannot change and keep fighting anyway.", "lines": [["Some things can be solved. This session is for the ones that can’t.", 9], ["Bring one to mind. The situation you keep re-litigating in your head.", 11], ["Notice the fighting. The but it shouldn’t be this way. The if only.", 11], ["That fight is costing you something, and it isn’t changing the fact.", 11], ["Acceptance is not approval. Say that to yourself: acceptance is not approval.", 12], ["It doesn’t mean it was okay. It doesn’t mean you agree.", 11], ["It only means you stop spending your strength on a fact that is already true.", 12], ["Try the sentence: this is how it is right now.", 13], ["Again, slower. This is how it is right now.", 14], ["Notice what your body does when you stop bracing against it.", 13], ["Something usually lets go. Shoulders, or the breath.", 12], ["You will have to accept it again tomorrow. That’s normal. It isn’t one decision.", 12], ["Now ask: given that this is true, what do I want to do with today?", 15], ["That question was unavailable to you five minutes ago.", 10], ["One breath out, and come back.", 6]]}, {"id": "bus", "cat": "thoughts", "title": "Passengers on the bus", "mins": 6, "blurb": "ACT · you can drive with them still shouting.", "lines": [["Close your eyes. Picture yourself driving a bus.", 9], ["You choose the route. It’s your bus.", 10], ["Behind you are passengers. Every one of them is a thought or a fear you carry.", 11], ["The one that says you’re not doing enough. The one that says it’ll all fall apart.", 11], ["They shout directions. They tell you to turn around, or pull over.", 11], ["Most of us do one of two things. We argue with them, or we drive where they say.", 11], ["Arguing means you’ve stopped the bus. Obeying means you’ve given up the wheel.", 12], ["There’s a third option, and it’s uncomfortable at first.", 10], ["Let them shout. Keep driving.", 13], ["They can be as loud as they like. They cannot reach the wheel.", 13], ["Now think about where you actually want this bus to go.", 12], ["Not where the fear says. Where you would choose, if it were quiet.", 14], ["Point it that way.", 12], ["The noise may not change. Your direction can.", 11], ["One breath out. Keep driving.", 6]]}, {"id": "room", "cat": "thoughts", "title": "Making room", "mins": 6, "blurb": "ACT · stop wrestling the feeling and give it space instead.", "lines": [["Find the feeling that’s here. Don’t name it yet. Just find where it lives.", 11], ["Chest, throat, stomach, jaw. Somewhere it’s sitting.", 12], ["Now notice what you usually do with it. Push it down. Distract from it. Explain it away.", 11], ["That’s a wrestle, and it’s exhausting, and it’s been a draw for years.", 11], ["Today, no wrestling. Just make room for it.", 10], ["Breathe into that part of your body. Let the breath go around it, not at it.", 13], ["Imagine the space there getting slightly bigger. Not the feeling — the room it’s in.", 13], ["You’re not trying to make it leave. You’re letting it be here without a fight.", 13], ["Now name it, gently. Sadness. Fear. Longing. Whatever it is.", 13], ["Say: this is here, and I can carry it.", 13], ["Notice it probably didn’t grow when you stopped pushing. Often it settles.", 13], ["Feelings behave like weather when you stop arguing with the sky.", 12], ["Stay with it a little longer.", 16], ["When you’re ready, come back. You didn’t have to win.", 6]]}, {"id": "values", "cat": "thoughts", "title": "If fear weren’t driving", "mins": 4, "blurb": "ACT · what actually matters, underneath the managing.", "lines": [["Let one long breath out, and let the shoulders follow it.", 9], ["A question, and it needs a slow answer.", 8], ["If you weren’t afraid of anything — not one thing — what would you do differently this week?", 15], ["Don’t plan it. Just see it.", 12], ["Now a harder one. Who would you be to the people in your house?", 14], ["Notice that almost nothing on your list required more money or more time.", 12], ["Most of it required your attention, which you already have.", 12], ["Pick one. The smallest one.", 13], ["Now shrink it until it fits in today.", 14], ["That’s the thing to do. Not because it will fix anything. Because it’s who you want to be.", 12], ["Fear will still be in the passenger seat. Do it anyway.", 10], ["One breath out, and go.", 6]]}, {"id": "orient", "cat": "somatic", "title": "Look around the room", "mins": 5, "blurb": "Somatic · orienting, the body’s own way of deciding it’s safe.", "lines": [["Keep your eyes open. This one is done looking, not thinking.", 8], ["Slowly turn your head to the right. Let your eyes lead.", 11], ["Don’t scan for danger. Just let your eyes land wherever they want.", 11], ["Now slowly to the left, the same way.", 12], ["Notice the corners of the room. The ceiling. Behind you, if you can turn.", 13], ["Your body is checking the space. This is an old, wordless thing it knows how to do.", 12], ["Let it take its time.", 13], ["Now find one thing in this room you actually like looking at.", 12], ["Rest your eyes there. Let a breath go all the way out.", 12], ["Notice if anything shifted. A sigh, a swallow, shoulders coming down.", 12], ["That’s your body deciding it’s alright here. You didn’t have to convince it with words.", 11], ["Stay a moment.", 13], ["This is a good one to do in a parking lot before you go in anywhere.", 6]]}, {"id": "pendulate", "cat": "somatic", "title": "Back and forth", "mins": 6, "blurb": "Somatic · moving between the tight place and an easy one.", "lines": [["Sit comfortably. Eyes closed or soft.", 9], ["First, find a place in your body that feels tight, or braced, or buzzing.", 13], ["Don’t go into it. Just notice where it is, the way you’d note the weather.", 12], ["Now find a different place that feels neutral or easy.", 13], ["Your feet, maybe. Your hands. The back of your legs on the chair.", 12], ["Rest your attention there a moment. Let it be genuinely comfortable.", 13], ["Now go back to the tight place — just for a few seconds.", 12], ["And come back to the easy place.", 12], ["That’s the whole practice. Back and forth. Never staying long in the hard one.", 12], ["Tight place.", 9], ["Easy place. Let it be easy.", 12], ["Tight place.", 9], ["Easy place. Breathe out there.", 13], ["This teaches your body that it can visit difficulty and leave again.", 12], ["If anything ever gets to be too much, open your eyes and look around the room. That’s not failing.", 11], ["Finish in the easy place. Stay there.", 14], ["One breath out, and come back.", 6]]}, {"id": "hum", "cat": "somatic", "title": "Hum it out", "mins": 4, "blurb": "Somatic · a long, low sound. Strange, and it works.", "lines": [["This one makes noise, so find somewhere you won’t feel silly.", 9], ["Take a normal breath in through your nose.", 8], ["Now let it out as a low hum. Not loud. Long.", 10], ["Again. In through the nose.", 6], ["And hum it out until the air runs low.", 11], ["Feel where it buzzes. Lips, chest, the front of your throat.", 10], ["Again, lower this time.", 6], ["Hum it all the way out.", 12], ["Long, slow sound does something to the nerve that runs down your throat and into your chest.", 10], ["It tells the body the danger has passed. You can’t argue your way there. You can hum your way there.", 11], ["Four more on your own, as low and long as you can.", 26], ["Now sit in the quiet afterwards.", 12], ["Notice how still it is in here now.", 6]]}, {"id": "butterfly", "cat": "somatic", "title": "The butterfly hug", "mins": 6, "blurb": "Somatic · slow alternating taps, and something settles.", "lines": [["Cross your arms over your chest, hands resting near your collarbones.", 10], ["Like you’re hugging yourself, loosely.", 8], ["Now tap slowly. Left hand. Right hand. Left. Right.", 11], ["Slower than a heartbeat. Unhurried.", 12], ["Keep tapping and let your breath go all the way out.", 12], ["Left. Right. Left. Right.", 13], ["You don’t have to think about anything in particular.", 13], ["If a hard thought shows up, keep tapping. Let it pass through.", 13], ["Left. Right.", 13], ["Now bring to mind one thing that’s steady in your life. A person, a place, a room.", 13], ["Hold that while you keep tapping.", 16], ["Let it get slower still.", 15], ["Now stop, and let your hands rest.", 12], ["Sit in the quiet a moment and notice what’s different.", 12], ["This is a good one for the middle of the night.", 6]]}, {"id": "beginner", "cat": "learning", "title": "Being a beginner again", "mins": 5, "blurb": "For the part of learning where you are visibly not good yet.", "lines": [["Sit down, and let one breath go all the way out.", 9], ["You are at the beginning of something, and it shows. That is the whole difficulty.", 10], ["Notice where you feel it in your body. Often the chest, or the back of the neck.", 12], ["Now, gently: what you are feeling is not a sign you shouldn’t be here.", 11], ["It’s the feeling of being new. Everyone who is good at anything felt it first.", 12], ["Bring to mind someone you admire at the thing you’re learning.", 12], ["They were once exactly where you are, and nobody was watching them either.", 12], ["Breathe out.", 10], ["There is no way to skip this part. There is only going through it, badly, for a while.", 12], ["And here is the kind thing — badly is allowed. Badly is the price, and it’s a fair one.", 12], ["Say this to yourself: I am allowed to be new at this.", 13], ["Again, slower.", 13], ["Stay here a moment.", 14], ["When you’re ready, go and be new at it.", 6]]}, {"id": "compare", "cat": "learning", "title": "When you’re measuring yourself against someone", "mins": 5, "blurb": "For the quiet ache of watching someone else be further along.", "lines": [["Let your eyes close, and breathe out slowly.", 9], ["Somebody is on your mind. Somebody who seems further along than you.", 11], ["Don’t push the thought away. Let them be there.", 11], ["Notice you are comparing the inside of your life to the outside of theirs.", 12], ["You know every hesitation of yours. You know almost none of theirs.", 12], ["Notice, too, that you can’t see their beginning from here. Only the part they arrived at.", 12], ["Breathe out.", 10], ["Here is something worth sitting with. Their being further along takes nothing from you.", 12], ["There isn’t a fixed amount of it. Their good year doesn’t shorten yours.", 12], ["If you can, wish them well. Genuinely. It costs nothing and it loosens something.", 13], ["Now come back to your own road, at the place where you actually are.", 12], ["That place is real, and it is yours, and it is moving.", 13], ["One breath out, and open your eyes.", 6]]}, {"id": "effort", "cat": "learning", "title": "Working with nothing to show yet", "mins": 6, "blurb": "For the long middle, before anything is visible.", "lines": [["Sit, and let the day settle for a moment.", 9], ["You have been putting effort into something and there is nothing to point at.", 11], ["That stretch is the hardest part of anything worth doing, and almost nobody talks about it.", 12], ["Breathe out, long.", 10], ["Think of a root system. Months underground before a single leaf.", 12], ["Nothing above the soil is happening. Everything below it is.", 13], ["You cannot see your own roots either. That’s not evidence they aren’t growing.", 13], ["Now think back to a time you couldn’t do something you can do easily now.", 14], ["There was a middle then too, and it felt exactly like this.", 13], ["You forgot it because the middle is the part nobody remembers.", 12], ["Breathe out.", 11], ["Nothing is required of you today except to keep going a little.", 12], ["Not brilliantly. A little.", 13], ["Stay here a moment longer.", 15], ["When you’re ready, go back to it. The roots are doing their work.", 6]]}, {"id": "failed", "cat": "learning", "title": "After something didn’t work", "mins": 7, "blurb": "For when you tried at something that mattered, and it went badly.", "lines": [["Come and sit. Nothing here is going to ask you to be positive about this.", 10], ["Take one long breath out and let your shoulders come down with it.", 10], ["Something you cared about did not go the way you hoped.", 11], ["First, let that be disappointing. It is. Skipping past that doesn’t work.", 13], ["Feel where it sits in your body, and breathe there for a moment.", 14], ["Now, notice the voice that has started up. The one saying what this means about you.", 12], ["Listen to how it speaks. Would you let anyone speak to a friend that way?", 13], ["Try this instead: this went badly, and I am not a lesser person tonight than I was yesterday.", 13], ["Say it again, even if it doesn’t land yet.", 13], ["Now, gently, and only if you’re ready — what would you do differently?", 15], ["Not as a punishment. As information.", 13], ["That question is only available to someone who tried. People who don’t try never get to ask it.", 12], ["Breathe out.", 11], ["You attempted something real. That is not nothing, whatever came of it.", 13], ["Stay here a while.", 15], ["When you’re ready, be as kind to yourself as you would be to anyone else who tried.", 6]]}, {"id": "ask", "cat": "learning", "title": "Asking for help", "mins": 4, "blurb": "For when you know who to ask, and haven’t.", "lines": [["Breathe out, and bring the thing you’re stuck on to mind.", 10], ["Now bring to mind the person who could probably help.", 11], ["Notice what comes up. Usually a reason not to ask.", 11], ["You should be able to work it out. They’re busy. You’d be admitting something.", 12], ["Turn it around. Think of the last time somebody asked you for help.", 13], ["Did you think less of them?", 12], ["You almost certainly felt trusted. People generally do.", 12], ["Asking is not a confession of inadequacy. It’s how anyone learns anything faster than alone.", 12], ["Breathe out.", 10], ["Picture the message. It doesn’t need to be long.", 12], ["Now open your eyes, and send it before the reasons come back.", 6]]}];

/* Sessions can also live as separate files next to this one, in an "audio" folder.

/* The pace a session is written to run at: about 85ms a character to read
   the line aloud, plus the silence the script asks for after it. The silent
   rehearsal and a real recording use the same numbers, so a voice recorded
   along to the silent run lines up exactly. */
/* PACE is measured, not guessed: read the six recorded sessions against this
   formula and they come out about 1.4x longer. Reading along to the screen
   should feel unhurried, so the screen moves at the pace a person actually reads. */
const PACE = 1.4;
function lineMs(line, scale){ return ((line[0].length * 0.085) + line[1]) * 1000 * PACE * (scale || 1); }

const AUDIO_BASE = 'audio/';
/* Where the audio folder sits, worked out from the page's own address so it
   holds up whether the URL ends in a slash, a filename, or neither. */
function audioUrls(id){
  const out=[];
  try{
    const p = location.pathname || '/';
    if(/\.[a-z0-9]+$/i.test(p))      out.push(p.replace(/[^/]*$/,'') + AUDIO_BASE + id + '.m4a');
    else if(p.endsWith('/'))          out.push(p + AUDIO_BASE + id + '.m4a');
    else                              out.push(p + '/' + AUDIO_BASE + id + '.m4a');
  }catch(e){}
  out.push(AUDIO_BASE + id + '.m4a');          // plain relative, for local files
  return out.filter((v,i,a)=>a.indexOf(v)===i);
}
/* Last fetch attempt, kept so the app can tell you what it tried. */
let LAST_AUDIO_TRY = null;
async function remoteAudio(id){
  try{
    const cached = await mediaGet('cache_'+id);
    if(cached) return URL.createObjectURL(cached);
  }catch(e){}
  for(const u of audioUrls(id)){
    try{
      LAST_AUDIO_TRY = u;
      const r = await fetch(u);            // normal caching — never reuse a stale 404
      if(!r.ok) continue;
      const b = await r.blob();
      if(b.size < 2000) continue;
      if(b.type && b.type.indexOf('text') === 0) continue;   // a 404 page, not audio
      try{ await mediaPut('cache_'+id, b); }catch(e){}
      return URL.createObjectURL(b);
    }catch(e){}
  }
  return null;
}

const MEDIA_DB='fmc_media';
function mdb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(MEDIA_DB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('m')) r.result.createObjectStore('m'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function mediaPut(key,blob){ const d=await mdb(); return new Promise((res,rej)=>{
  const t=d.transaction('m','readwrite'); t.objectStore('m').put(blob,key);
  t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); }); }
async function mediaGet(key){ const d=await mdb(); return new Promise((res)=>{
  const t=d.transaction('m','readonly'); const q=t.objectStore('m').get(key);
  q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }
async function mediaDel(key){ const d=await mdb(); return new Promise((res)=>{
  const t=d.transaction('m','readwrite'); t.objectStore('m').delete(key);
  t.oncomplete=()=>res(true); t.onerror=()=>res(false); }); }
async function mediaKeys(){ const d=await mdb(); return new Promise((res)=>{
  const t=d.transaction('m','readonly'); const q=t.objectStore('m').getAllKeys();

/* shrink an uploaded image before storing */
function shrinkImage(file,maxDim,quality){
  return new Promise((res)=>{
    const rd=new FileReader();
    rd.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,maxDim/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc));
        c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>res(b),'image/jpeg',quality||0.84);
      };
      img.onerror=()=>res(null);
      img.src=e.target.result;
    };
    rd.onerror=()=>res(null);
    rd.readAsDataURL(file);
  });
}

/* hook: resolve a media key to an object URL */
function useMedia(key){
  const [url,setUrl]=useState(null);
  useEffect(()=>{
    let live=true, made=null;
    if(!key){ setUrl(null); return; }
    mediaGet(key).then(b=>{
      if(!live) return;
      if(b){ made=URL.createObjectURL(b); setUrl(made); }
      else setUrl(builtinImg(key));
    });
    return()=>{ live=false; if(made) URL.revokeObjectURL(made); };
  },[key]);
  return url;
}

function cupPct(n) {
  /* rises quickly at first so the early entries feel like something,
     and eases toward a brim it never quite reaches */
  return Math.round(94 * (1 - Math.exp(-n / 10)));
}

async function callAI(settings, sys, user) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': settings.aiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: settings.aiModel || 'claude-sonnet-4-5',
      max_tokens: 800,
      system: sys,
      messages: [{
        role: 'user',
        content: user
      }]
    })
  });
  if (!r.ok) throw new Error('AI error ' + r.status);
  const d = await r.json();
  return d.content.filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
}
function clip(t,n){ t=String(t||'').replace(/\s+/g,' ').trim(); return t.length>n ? t.slice(0,n)+'…' : t; }

/* Everything she has told this app, gathered for a prompt. Stays on the device
   until the moment of the call, and only a compressed summary is ever sent. */
/* The ✨ button, everywhere a question is asked. Marked so it is always obvious
   when a tap will use the person's own API key. */
function SparkAsk({db,kind,avoid,label,onGot,toast,style}){
  const [busy,setBusy]=useState(false);
  const has=!!db.settings.aiKey;
  return React.createElement('button',{
    className:'btn ghost sm',
    disabled:busy,
    style:Object.assign({opacity:has?1:.65},style||{}),
    onClick:async()=>{
      if(!has){ toast('Add an AI key in Settings and Grace can write these for you'); return; }
      setBusy(true);
      try{ onGot(await gracePrompt(db,kind,avoid||[])); }
      catch(e){ toast('Couldn’t reach Grace just now'); }
      setBusy(false);
    }
  }, busy ? 'Thinking…' : '✨ '+(label||'Ask Grace'));
}

async function gracePrompt(db,kind,avoid){
  const sys=aiSystem(db.profile)+`

RIGHT NOW your only job is to write ONE question for them to sit with — nothing else.
Draw on what you know of them below. Notice what they keep circling, what they avoid, what has shifted, what they have never once mentioned.
Rules: one sentence. Second person. Warm, specific, and answerable — not a riddle, not therapy-speak, not flattery. It may gently name something you have noticed, but it must end as a question.
Never speak as God, and never invent what God is saying. Return ONLY the question. No quotation marks, no preamble.`;
  const u='Here is everything they have told this app so far:\n\n'+graceContext(db)
    +(avoid&&avoid.length?'\n\nDo not repeat or lightly reword any of these, which you have already asked:\n'+avoid.map(a=>'· '+a).join('\n'):'')
    +(kind==='journal'
      ? '\n\nWrite one question for them to write a journal entry about today.'
      : kind==='cup'
      ? '\n\nWrite one question that helps them remember a specific time there was enough — a provision, a door that opened, a person who arrived. Point at a season or a part of their life they have not yet written about, if you can see one. It must be answerable with a concrete memory, not a feeling.'
      : kind==='gratitude'
      ? '\n\nWrite one very short question that helps them notice something good in the last day or two. Small and ordinary is better than large. Under fifteen words.'
      : kind==='vision'
      ? '\n\nWrite one question that helps them name a piece of the life they are praying toward — a specific, ordinary scene rather than a milestone or a number.'
      : '\n\nWrite one short question for them to answer in a line or two this morning.');
  const out=await callAI(db.settings,sys,u);
  return String(out||'').replace(/^["'\s]+|["'\s]+$/g,'').split('\n')[0].slice(0,220);
}

function graceContext(db){
  const p=db.profile||{}, out=[];
  out.push('WHO: '+(p.name||'friend')+'.');
  if((p.why||[]).length) out.push('CAME HERE BECAUSE: '+p.why.join('; ')+'.');
  if(p.carrying) out.push('CARRYING (their words): "'+clip(p.carrying,320)+'"');
  if(p.seeking)  out.push('THIRSTY FOR (their words): "'+clip(p.seeking,240)+'"');

  const cup=(db.cup||[]).slice(0,10);
  if(cup.length) out.push('IN THEIR CUP (times there was enough): '+cup.map(c=>(c.when?c.when+' — ':'')+clip(c.text,110)).join(' | '));

  const vis=(db.vision||[]).filter(v=>!v.hero);
  const hero=(db.vision||[]).find(v=>v.hero);
  if(hero) out.push('THE LIFE THEY PICTURE: "'+clip(hero.line,300)+'"');
  if(vis.length) out.push('PIECES OF THAT VISION: '+vis.map(v=>v.title+(v.already?' (already true: '+clip(v.already,60)+')':'')).join('; '));

  const ables=(db.able||[]).slice(0,4);
  if(ables.length) out.push('PROBLEMS THEY ARE WORKING THROUGH (ABLE):\n'+ables.map(e=>{
    const open=(e.tracks||[]).filter(t=>!t.closed);
    const notes=(e.tracks||[]).reduce((n,t)=>n+(t.rounds||[]).length,0);
    return '· '+clip(e.problem,120)
      +(open.length? ' → taking up: '+open.map(t=>clip(t.text,60)).join('; ') : '')
      +(notes? ' → '+notes+' notes on how it is going' : ' → nothing tried yet');
  }).join('\n'));
  const abil=(db.abilities||[]).slice(0,10);
  if(abil.length) out.push('THINGS THEY COULD NOT DO BEFORE: '+abil.map(x=>clip(x.text,90)).join(' | '));
  const j=(db.journal||[]).slice(0,6);
  if(j.length) out.push('RECENT JOURNAL:\n'+j.map(e=>{
    const gr=(e.convo||[]).filter(m=>m.role==='ai'&&!m.text.startsWith('__')).slice(-1)[0];
    return '· '+fmt(e.date)+(e.prompt?' ['+clip(e.prompt,70)+']':'')+' — "'+clip(e.text,260)+'"'
      + (gr?' (you replied: "'+clip(gr.text,140)+'")':'');
  }).join('\n'));

  const ans=(db.answers||[]).slice(0,6);
  if(ans.length) out.push('RECENT DAILY QUESTIONS: '+ans.map(a=>clip(a.q,60)+' → "'+clip(a.a,90)+'"').join(' | '));

  const gr=(db.gratitude||[]).slice(0,4).map(g=>(g.items||[]).filter(x=>x&&x.trim()).join(', ')).filter(Boolean);
  if(gr.length) out.push('RECENTLY GRATEFUL FOR: '+gr.join(' | '));

  return clip(out.join('\n'),4200);
}

function aiSystem(p) {

function pickVoice(pref){
  try{
    const vs=window.speechSynthesis.getVoices()||[];
    if(!vs.length) return null;
    if(pref){ const m=vs.find(v=>v.voiceURI===pref||v.name===pref); if(m) return m; }
    const nice=['Samantha','Ava','Allison','Serena','Moira','Karen','Google UK English Female','Google US English','Microsoft Aria','Microsoft Jenny','Fiona'];
    for(const nm of nice){ const m=vs.find(v=>v.name.indexOf(nm)>=0); if(m) return m; }
    return vs.find(v=>/en[-_]/i.test(v.lang)) || vs[0];
  }catch(e){ return null; }
}

function recentText(db){
  const bits=[];
  (db.journal||[]).slice(0,5).forEach(e=>bits.push(e.text||''));
  (db.able||[]).slice(0,3).forEach(a=>{ bits.push(a.problem||''); bits.push(a.fears||''); });
  (db.answers||[]).slice(0,5).forEach(a=>bits.push(a.a||''));
  (db.gratitude||[]).slice(0,3).forEach(g=>bits.push((g.items||[]).join(' ')));
  (db.cup||[]).slice(0,3).forEach(c=>bits.push(c.text||''));
  return bits.join(' \n ').toLowerCase();
}
function readSignals(db){
  const text=recentText(db); const hits=[];
  SIGNALS.forEach(([k,words])=>{
    const w=words.find(x=>text.indexOf(x)>=0);
    if(w) hits.push({k:k,word:w});
  });
  return hits;
}
function medsById(ids){
  return ids.map(id=>MEDS.filter(m=>m.id===id)[0]).filter(Boolean);
}
