function pickNudge(db) {
  const name=(db.companion&&db.companion.name)||'Grace';
  if (!(db.companion && db.companion.metGrace)) {
    return 'Hi — I’m ' + name + '. I’ll be right here, keeping you company. Tap me whenever you’d like, and let me float when you’d rather just be.';
  }
  const pool=[];
  const t=today();
  const n=db.cup.length;

  /* something with a date on it */
  (db.able||[]).forEach(a=>{
    (a.tracks||[]).filter(x=>!x.closed&&x.due).forEach(x=>{
      const d=dueInfo(x.due);
      if(!d) return;
      if(d.text==='today')    pool.push('“'+clip(x.text,44)+'” — that was for today. How did it go?');
      else if(d.text==='tomorrow') pool.push('“'+clip(x.text,44)+'” is for tomorrow. Nothing to do about it tonight.');
      else if(d.text.indexOf('was due')===0) pool.push('“'+clip(x.text,44)+'” slipped past its day. That’s allowed — want to give it a new one?');
    });
  });

  /* an open loop with no notes yet */
  (db.able||[]).forEach(a=>{
    (a.tracks||[]).filter(x=>!x.closed&&(x.rounds||[]).length===0&&daysSince(a.date)>=3).forEach(x=>{
      pool.push('You took up “'+clip(x.text,40)+'” a few days ago. Even “nothing yet” is worth writing down.');
    });
  });

  /* the journal */
  const lastJ=(db.journal||[])[0];
  if(lastJ&&daysSince(lastJ.date)>=4) pool.push('It’s been a little while since you wrote anything longer. No pressure — the page is there.');
  if(lastJ&&daysSince(lastJ.date)<=1&&(lastJ.convo||[]).length===0&&db.settings.aiKey)
    pool.push('I read what you wrote. Tap me if you’d like to talk it through.');

  /* the cup */
  if(n===0) pool.push('Your cup is empty. One entry — anything — and this whole place starts working.');
  else if(n<5) pool.push(n+' in the cup so far. It only ever goes up.');
  else if(n>=8) pool.push('There are '+n+' things in your cup. That’s '+n+' times there was enough.');
  const lastC=db.cup[0];
  if(lastC&&daysSince(lastC.date)>=10) pool.push('Nothing has gone in the cup for a while. Has anything quietly worked out?');

  const gt=(db.gratitude||[]).filter(x=>x.date===t)[0];
  const filled=gt?(gt.items||[]).filter(x=>x&&x.trim()).length:0;
  if(filled===0) pool.push('Three small things, whenever you get a moment.');
  else if(filled<3) pool.push('One more and today’s three are done.');
  else pool.push('Three today. Any of them worth keeping in the cup for good?');

  /* the vision */
  if((db.vision||[]).length===0) pool.push('Nothing in the Vision yet. What does an ordinary afternoon look like, a few years out?');
  const noEvidence=(db.vision||[]).filter(v=>!v.hero&&!(v.already||'').trim())[0];

  /* what they came here for */
  const why=(db.profile.why||[]);
  if(why.indexOf('I want to be more present')>=0) pool.push('Five things you can see, right where you are. That’s the whole practice.');
  if(why.indexOf('I want to be still')>=0) pool.push('There’s a two-minute one in Still. Two minutes.');

  /* growth */
  if((db.abilities||[]).length===0) pool.push('There’s a list at the foot of the Cup for things you couldn’t do before. Worth starting.');
  else pool.push('You’ve written down '+(db.abilities||[]).length+' things you couldn’t do before. That list is quietly remarkable.');

  /* an invitation, and a nudge outward */
  if(db.settings.aiKey) pool.push('I’ve been reading along. Ask me anything — even just “what are you noticing?”');
  pool.push('When did you last talk to someone who knows you well? Not me — a person.');
  pool.push('If the worry shows up today, come read the cup before you check anything.');
  pool.push('Nothing is wrong in this exact minute. Worth noticing.');
  pool.push('You don’t have to earn today.');

  return pool[Math.floor(Math.random() * pool.length)];
}

async function callAIMessages(settings,sys,messages){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':settings.aiKey,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:settings.aiModel||'claude-sonnet-4-5',max_tokens:900,system:sys,messages:messages})
  });
  if(!r.ok) throw new Error('AI error '+r.status);
  const d=await r.json();
  return d.content.filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
}

function quadrant(o){
  const i=+o.impact||0, d=+o.effort||0;
  if(!i||!d) return null;
  if(i>=2 && d<=2) return {label:'A good place to start', tone:'var(--sage)'};
  if(i>=2 && d===3) return {label:'Worth the time',       tone:'var(--acc)'};
  if(i===1 && d<=2) return {label:'Easy and kind to do',   tone:'var(--spark-deep)'};
  return {label:'Rest this one for now', tone:'var(--ink-faint)'};
}
function dueInfo(d){
  if(!d) return null;
  const t=today();
  if(d<t)  return {tone:'var(--rose)',   text:'was due '+prettyDay(d)};
  if(d===t)return {tone:'var(--spark-deep)', text:'today'};
  const days=Math.round((new Date(d+'T12:00')-new Date(t+'T12:00'))/86400000);
  if(days===1) return {tone:'var(--acc-deep)', text:'tomorrow'};
  if(days<=7)  return {tone:'var(--acc-deep)', text:'in '+days+' days'};
  return {tone:'var(--ink-faint)', text:prettyDay(d)};
}
function ableOpen(a){ return (a.tracks||[]).filter(t=>!t.closed); }
